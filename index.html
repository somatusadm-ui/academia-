function eCanc(n){return !!(D.canc&&D.canc.find(function(c){return c.nome===n&&(c.ativo===true||String(c.ativo).toLowerCase()==="true");}));}
function todosObj(){var lista=[];AF.forEach(function(a){var editado=D.mat.find(function(m){return m.nome===a.nome;});if(editado){lista.push({nome:editado.nome,numero:editado.numero,plano:editado.plano,valor:+editado.valor,diaVenc:+editado.diaVenc,diasSem:editado.diasSem,horario:editado.horario,prof:editado.prof,fixo:true,dataMatricula:editado.dataMatricula||editado.data||"",desconto:editado.desconto||0,promocao:editado.promocao||""});}else{lista.push({nome:a.nome,numero:a.numero,plano:a.plano,valor:a.valor,diaVenc:a.diaVenc,diasSem:a.diasSem,horario:a.horario,prof:a.prof,fixo:true,dataMatricula:a.dataMatricula||"",desconto:a.desconto||0,promocao:a.promocao||""});}});D.mat.forEach(function(m){if(!lista.find(function(a){return a.nome===m.nome;})){lista.push({nome:m.nome,numero:m.numero,plano:m.plano,valor:+m.valor,diaVenc:+m.diaVenc,diasSem:m.diasSem,horario:m.horario,prof:m.prof,fixo:false,dataMatricula:m.dataMatricula||m.data||"",desconto:m.desconto||0,promocao:m.promocao||""});}});return lista;}
function ativos(){return todosObj().filter(function(a){return!eCanc(a.nome);});}

function fd(s){
  if(!s||s===""||s==="undefined"||s===null)return "—";
  var d;
  if(typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s)){var p=s.split("-");d=new Date(+p[0],+p[1]-1,+p[2]);}
  else d=new Date(s);
  if(isNaN(d.getTime()))return "—";
  return d.toLocaleDateString("pt-BR");
}

async function loadAba(aba){
  try{
    var r=await fetch(SURL+"?aba="+encodeURIComponent(aba));
    var rows=await r.json();
    if(!Array.isArray(rows)||rows.length<2)return[];
    var h=rows[0];
    return rows.slice(1).map(function(row){
      var obj={};
      h.forEach(function(k,i){
        var v=row[i];
        var vl=String(v).toLowerCase().trim();
        if(vl==="true")obj[k]=true;
        else if(vl==="false")obj[k]=false;
        else if(v!==""&&v!==null&&v!==undefined&&String(v).trim()!==""&&!isNaN(v))obj[k]=+v;
        else obj[k]=v||"";
      });
      return obj;
    });
  }catch(e){return null;}
}

function dataVencMes(diaVenc,ano,mes){
  // Constrói YYYY-MM-DD para o dia escolhido pelo aluno no mês/ano dados
  // Se o dia não existe no mês (ex: dia 31 em fevereiro), usa o último dia
  var ultimoDia=new Date(ano,mes,0).getDate();
  var dia=Math.min(+diaVenc,ultimoDia);
  return ano+"-"+String(mes).padStart(2,"0")+"-"+String(dia).padStart(2,"0");
}

function gerarCaixa(){
  var ano=MES_ANO.a,mes=MES_ANO.m;
  var pfxMes=ano+"-"+String(mes).padStart(2,"0");
  var vistos=new Set();
  var lista=[];
  ativos().forEach(function(a){
    if(vistos.has(a.nome))return;
    vistos.add(a.nome);
    var dv=dataVencMes(a.diaVenc,ano,mes);
    var pgList=D.pag.filter(function(p){return p.aluno===a.nome&&p.data&&p.data.startsWith(pfxMes);});
    var pago=pgList.length>0;
    var inf=pago?pgList[0]:null;
    lista.push({nome:a.nome,valor:a.valor,plano:a.plano,dataVenc:dv,pago:pago,dataPag:inf?inf.data:"",numDoc:"",formaPag:inf?inf.forma:"",diasSem:a.diasSem||""});
  });
  return lista;
}

function ensureCaixaMes(){
  var ano=MES_ANO.a,mes=MES_ANO.m,pfx=mesAtualPfx();
  // Remover do caixa qualquer entrada de aluno cancelado
  D.caixa=D.caixa.filter(function(c){return!eCanc(c.nome);});
  // Remover duplicatas (manter só 1 por nome/mês)
  var vistos=new Set();
  D.caixa=D.caixa.filter(function(c){
    if(!c.dataVenc)return true;
    var chave=c.nome+"|"+c.dataVenc.substring(0,7);
    if(vistos.has(chave))return false;
    vistos.add(chave);
    return true;
  });
  // Adicionar alunos ativos que ainda não têm entrada no mês
  ativos().forEach(function(a){
    var jaTem=D.caixa.find(function(c){return c.nome===a.nome&&c.dataVenc&&c.dataVenc.startsWith(pfx);});
    if(!jaTem){
      var dv=dataVencMes(a.diaVenc,ano,mes);
      var pfxMes=pfx;
      var pgList=D.pag.filter(function(p){return p.aluno===a.nome&&p.data&&p.data.startsWith(pfxMes);});
      var pago=pgList.length>0;
      var inf=pago?pgList[0]:null;
      D.caixa.push({nome:a.nome,valor:a.valor,plano:a.plano,dataVenc:dv,pago:pago,dataPag:inf?inf.data:"",numDoc:"",formaPag:inf?inf.forma:"",diasSem:a.diasSem||""});
    }
  });
}

async function syncAll(){
  showLov(true);
  var cats=["pag","mat","desp","aulas","pres","exp","caixa","canc","feedbacks","agenda"];
  var abas=["pagamentos","matriculas","despesas","aulas","presencas","experimentais","caixa","cancelados","feedbacks","agenda"];
  var ok=true;
  for(var i=0;i<cats.length;i++){var rows=await loadAba(abas[i]);if(rows===null){ok=false;break;}if(rows.length>0)D[cats[i]]=rows;}
  if(!ok){syncOk=false;showLov(false);alert("Erro ao carregar dados do Google Sheets.");return;}
  if(D.caixa.length===0){D.caixa=gerarCaixa();}
  ensureCaixaMes();
  // Salvar caixa limpo (sem cancelados, sem duplicatas) de volta ao Sheets
  await saveCaixa();
  syncOk=ok;showLov(false);
}

async function seed(){
  var ph=["aluno","data","tabela","desconto","bruto","liquido","forma","tipoOp","numDoc","banco"];
  for(var i=0;i<PI.length;i++){var p=PI[i];await push("pagamentos",ph,ph.map(function(h){return String(p[h]||"");}));}
  var dh=["descricao","valor","data","forma","tipo"];
  for(var i=0;i<DI.length;i++){var d=DI[i];await push("despesas",dh,dh.map(function(h){return String(d[h]||"");}));}
  var ch=["nome","valor","plano","dataVenc","pago","dataPag","numDoc","formaPag"];
  for(var i=0;i<D.caixa.length;i++){var c=D.caixa[i];await push("caixa",ch,ch.map(function(h){return String(c[h]||"");}));}
}

function isPago(c){return c.pago===true||String(c.pago).toLowerCase()==="true";}
function setMesCaixa(m){mesAtualCaixa=m;}
function caixaHtml(){
  try{

  var pfx=_ca+"-"+String(_cm).padStart(2,"0")+"-";
  var hoje=new Date().toISOString().split("T")[0];
  var caixaMes=D.caixa.filter(function(c){
    if(!c.dataVenc)return false;
    if(eCanc(c.nome))return false;
    if(c.dataVenc.startsWith(pfx))return true;
    if(c.dataVenc<pfx&&!isPago(c))return true;
    return false;
  });
  // Remover duplicatas por nome (manter só 1 por aluno neste mês)
  var nomesVisto=new Set();
  caixaMes=caixaMes.filter(function(c){
    if(nomesVisto.has(c.nome))return false;
    nomesVisto.add(c.nome);
    return true;
  });
  var pend=caixaMes.filter(function(c){return!isPago(c);}).sort(function(a,b){return a.dataVenc>b.dataVenc?1:-1;});
  var rec=caixaMes.filter(function(c){return isPago(c);});
  var tPend=pend.reduce(function(a,c){return a+(+c.valor||0);},0);
  var tRec=rec.reduce(function(a,c){return a+(+c.valor||0);},0);

      +"<button class='btn bd bsm' onclick='excluirCaixa("+i+")' title='Excluir'><i class='ti ti-trash'></i></button></span>"
      +"</div>";
  }).join("");
  var rR=rec.map(function(c){
    return "<div class='ci' style='opacity:.75'>"
      +"<span>"+fd(c.dataVenc)+"</span>"
      +"<span>"+c.nome.split(" ").slice(0,2).join(" ")+"</span>"
      +"<span style='color:var(--gn);font-weight:700'>"+BRL(c.valor)+"</span>"
      +"<span>"+c.plano+"</span>"
      +"<span><span class='chip'><i class='ti ti-check'></i> Pago</span></span>"
      +"<span style='font-size:11px'>"+fd(c.dataPag)+"</span>"
      +"<span style='font-size:11px;color:var(--mt)'>"+(c.formaPag||"&#8212;")+"</span>"
      +"</div>";
  }).join("");
  var meses_cx=new Set();
  D.caixa.forEach(function(c){if(c.dataVenc)meses_cx.add(c.dataVenc.substring(0,7));});
  var opts_cx=Array.from(meses_cx).sort().reverse().map(function(m){
    var mm=m.split("-"),lbl=["","Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"][+mm[1]]+"/"+mm[0];
    var val=String(+mm[1]).padStart(2,"0")+"/"+mm[0];
    return "<option value='"+val+"'"+(mesAtualCaixa===val?" selected":"")+">"+lbl+"</option>";
  }).join("");

    +"<select onchange='setMesCaixa(this.value);refreshContent()'>"+opts_cx+"</select></div></div>"
    +"<div class='g3'>"
    +"<div class='kpi'><div class='ka' style='background:var(--am)'></div><p class='kl'>A Receber</p><p class='kv' style='color:var(--am)'>"+BRL(tPend)+"</p><p class='ks'>"+pend.length+" pendentes</p></div>"
    +"<div class='kpi'><div class='ka' style='background:var(--gn)'></div><p class='kl'>Entrada La\u00e7ada</p><p class='kv' style='color:var(--gn)'>"+BRL(tRec)+"</p><p class='ks'>"+rec.length+" pagamentos</p></div>"
    +"<div class='kpi'><div class='ka' style='background:var(--brand2)'></div><p class='kl'>Total Previsto</p><p class='kv' style='color:var(--brand2)'>"+BRL(tPend+tRec)+"</p><p class='ks'>"+mesAtualCaixa+"</p></div>"
    +"</div>"

  }catch(e){console.error("caixaHtml:",e);return "<div class='card'><p class='empty'>Erro: "+e.message+"</p></div>";}

function calcDesc(base){
  var sel=document.getElementById("bds").value,wrap=document.getElementById("bdc"),vEl=document.getElementById("bv");
  if(sel==="c"){wrap.style.display="";var cv=parseFloat(document.getElementById("bdcv").value)||0;vEl.value=(base-cv).toFixed(2);}
  else{wrap.style.display="none";vEl.value=(base*(1-sel/100)).toFixed(2);}
  calcLiqB();
}
function calcLiqB(){
  var b=parseFloat(document.getElementById("bv").value)||0,f=document.getElementById("bf").value||"PIX",el=document.getElementById("bl");
  var liq=lq(b,f),taxa=b-liq;
  if(el)el.value=BRL(liq);
  var elTaxa=document.getElementById("tx-taxa"),elLiq=document.getElementById("tx-liquido");
  if(elTaxa)elTaxa.textContent="-"+BRL(taxa);
  if(elLiq)elLiq.textContent=BRL(liq);
}
async function confBaixa(idx){
  var data=document.getElementById("bd").value,numDoc=document.getElementById("bn").value,forma=document.getElementById("bf").value,valor=parseFloat(document.getElementById("bv").value)||0;
  if(!data){alert("Preencha a data.");return;}
  var c=D.caixa[idx];
  c.pago=true;c.dataPag=data;c.numDoc=numDoc;c.formaPag=forma;
  var liq2=lq(valor,forma),desc=+((+c.valor)-valor).toFixed(2);
  // Atualizar campo de valor líquido com o valor final
  var blField=document.getElementById("bl");
  if(blField){blField.value=BRL(liq2);}
  var pObj={aluno:c.nome,data:data,tabela:+c.valor,desconto:desc,bruto:valor,liquido:liq2,forma:forma,plano:"Mensalidade",banco:"SICREDI"};
  D.pag.push(pObj);
  await savePagamentos();
  await saveCaixa();
  closeModal();refreshContent();
}

function setMesPag(m){mesAtualPag=m;}

  var pfxPag=_pa+"-"+_pm+"-";

  D.pag.forEach(function(p){if(p.data)meses_pg.add(p.data.substring(0,7));});

    var mm=m.split("-"),lbl=["","Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"][+mm[1]]+"/"+mm[0];
    var val=String(+mm[1]).padStart(2,"0")+"/"+mm[0];

  }).join("");

  var opts=nomes.concat(cancelados().map(function(a){return a.nome;})).map(function(n){return "<option>"+n+"</option>";}).join("")+"<option>Outro</option>";
  var rows=pag_mes.map(function(p){
    var realIdx=D.pag.indexOf(p);

      +"<td>"+p.aluno.split(" ").slice(0,2).join(" ")+"</td>"
      +"<td><span class='badge bb'>"+(p.plano||p.tipoOp||"Mensalidade")+"</span></td>"
      +"<td>"+p.forma+"</td>"
      +"<td>"+BRL(p.bruto)+"</td>"
      +"<td style='color:var(--gn);font-weight:700'>"+BRL(p.liquido)+"</td>"

      +"<button class='btn bd bsm' onclick='excluirPagamento("+realIdx+")' title='Excluir'><i class='ti ti-trash'></i></button>"

    +"<div class='fr'><div class='fi'><label>Aluno</label><select id='pal' onchange='prefillAluno()'>"+opts+"</select></div>"

    +"<div class='fi'><label>Desconto (R$)</label><input type='number' id='pdc' placeholder='0,00' step='0.01' oninput='calcBruto()'></div>"
    +"<div class='fi'><label>Forma</label><select id='pf' onchange='atualizaLiq()'><option>PIX</option><option>Boleto</option><option>PIX Boleto</option><option>Dinheiro</option></select></div></div>"
    +"<div class='fr'><div class='fi'><label>Valor bruto (R$)</label><input type='number' id='pb' placeholder='0,00' step='0.01' oninput='atualizaLiq()'></div>"
    +"<div class='fi'><label>Valor l\u00edquido</label><input id='pliq' readonly style='background:var(--gl);color:var(--gn);font-weight:600'></div></div>"
    +"<div class='fi' style='margin-bottom:10px'><label>Tipo</label><select id='ppl'><option>Mensalidade</option><option>Matr\u00edcula</option><option>Aula avulsa</option></select></div>"
    +"<button class='btn bp bf' onclick='savePag()'><i class='ti ti-check'></i> Registrar pagamento</button></div>"
    +"<div class='card'><div class='sh'><p class='ct' style='margin-bottom:0'><i class='ti ti-list'></i> Pagamentos ("+D.pag.length+")</p>"
    +"<div style='display:flex;gap:8px;align-items:center'><span style='font-size:13px;color:var(--gn);font-weight:700'>Líq: "+BRL(totMes.l)+"</span>"
    +(D.pag.length>0?"<button class='btn bd bsm' onclick='excluirTodosPagamentos()'><i class='ti ti-trash'></i> Excluir todos</button>":"")
    +"</div></div>"

    +"<select onchange='setMesPag(this.value);refreshContent()'>"+opts_pg+"</select></div></div>"

function calcLiqEdit(){
  var b=parseFloat(document.getElementById("epb").value)||0;
  var f=document.getElementById("epf").value||"PIX";
  var el=document.getElementById("epl");if(el)el.value=lq(b,f).toLocaleString("pt-BR",{minimumFractionDigits:2});
}
async function salvarEdicaoPag(idx){
  var p=D.pag[idx];if(!p)return;
  p.data=document.getElementById("epd").value;
  p.forma=document.getElementById("epf").value;
  p.bruto=+document.getElementById("epb").value||p.bruto;
  p.liquido=lq(p.bruto,p.forma);
  p.plano=document.getElementById("eppl").value;
  await savePagamentos();
  closeModal();refreshContent();alert(p.aluno.split(" ")[0]+" atualizado!");
}
async function excluirTodosPagamentos(){
  if(!confirm("Excluir TODOS os pagamentos?"))return;
  if(!confirm("Confirma? Esta ação não pode ser desfeita."))return;
  D.pag=[];
  // Zerar status pago no caixa
  D.caixa.forEach(function(c){c.pago=false;c.dataPag="";c.numDoc="";c.formaPag="";});
  await savePagamentos();
  await saveCaixa();
  refreshContent();
}
async function excluirPagamento(idx){
  var p=D.pag[idx];
  if(!p)return;
  if(!confirm("Excluir pagamento de "+p.aluno.split(" ")[0]+" ("+BRL(p.bruto)+" em "+fd(p.data)+")?"))return;
  // Reverter status no caixa
  var pfxMes=p.data?p.data.substring(0,7):"";
  var cx=D.caixa.find(function(c){return c.nome===p.aluno&&c.dataVenc&&c.dataVenc.startsWith(pfxMes);});
  if(cx&&isPago(cx)){
    // Checar se há outro pagamento no mesmo mês para este aluno
    var outrosPag=D.pag.filter(function(x,xi){return xi!==idx&&x.aluno===p.aluno&&x.data&&x.data.startsWith(pfxMes);});
    if(outrosPag.length===0){cx.pago=false;cx.dataPag="";cx.numDoc="";cx.formaPag="";}
  }
  D.pag.splice(idx,1);
  // Reescrever aba pagamentos inteira
  await savePagamentos();
  // Salvar caixa atualizado
  await saveCaixa();
  refreshContent();
}
function prefillAluno(){
  var nome=document.getElementById("pal").value,d=getDados(nome);
  if(d&&d.valor){document.getElementById("pt").value=d.valor;calcBruto();}
}
function calcBruto(){
  var t=parseFloat(document.getElementById("pt").value)||0,dc=parseFloat(document.getElementById("pdc").value)||0,b=t-dc;
  document.getElementById("pb").value=b>0?b.toFixed(2):"";atualizaLiq();
}
function atualizaLiq(){
  var b=parseFloat(document.getElementById("pb").value)||0,f=document.getElementById("pf").value||"PIX",el=document.getElementById("pliq");
  if(el)el.value=lq(b,f).toLocaleString("pt-BR",{minimumFractionDigits:2});
}
async function savePag(){
  var aluno=document.getElementById("pal").value,data=document.getElementById("pd").value;
  var bruto=+document.getElementById("pb").value||0,forma=document.getElementById("pf").value;
  if(!data||!bruto){alert2("pa","Preencha data e valor.",false);return;}
  var liquido=lq(bruto,forma);
  var plano=document.getElementById("ppl").value;
  var pfxMes=data.substring(0,7);
  var obj={aluno:aluno,data:data,tabela:+document.getElementById("pt").value||0,desconto:+document.getElementById("pdc").value||0,bruto:bruto,liquido:liquido,forma:forma,plano:plano,banco:"SICREDI"};
  D.pag.push(obj);
  // Atualizar status no caixa pelo mês correto
  var cx=D.caixa.find(function(c){return c.nome===aluno&&c.dataVenc&&c.dataVenc.startsWith(pfxMes)&&!isPago(c);});
  if(cx){cx.pago=true;cx.dataPag=data;cx.formaPag=forma;}
  await savePagamentos();
  await saveCaixa();
  alert2("pa","Pagamento registrado! Caixa atualizado.",true);
  setTimeout(function(){refreshContent();},800);
}

async function salvarEdicaoMat(nome){
  var plano=document.getElementById("epl").value,valor=+document.getElementById("ev").value||0;
  var diaVenc=+document.getElementById("edv").value||1,diasSem=document.getElementById("eds").value;
  var horario=document.getElementById("eh").value,prof=document.getElementById("epr").value;
  var desconto=+document.getElementById("edes").value||0,promocao=document.getElementById("epro").value;
  var novaDataMat=document.getElementById("edm")?document.getElementById("edm").value:"";
  
  // Atualizar AF (alunos fixos/todos)
  var af=AF.find(function(a){return a.nome===nome;});
  if(af){
    af.plano=plano;af.valor=valor;af.diaVenc=diaVenc;af.diasSem=diasSem;af.horario=horario;
    af.prof=prof;af.desconto=desconto;af.promocao=promocao;af.dataMatricula=novaDataMat||af.dataMatricula;
  }
  
  // Atualizar D.mat (novo)
  var mat=D.mat.find(function(m){return m.nome===nome;});
  if(mat){
    mat.plano=plano;mat.valor=valor;mat.diaVenc=diaVenc;mat.diasSem=diasSem;mat.horario=horario;
    mat.prof=prof;mat.desconto=desconto;mat.promocao=promocao;mat.dataMatricula=novaDataMat||mat.data;
  }
  
  // Se não está em D.mat, adicionar como novo
  if(!mat&&af){
    D.mat.push({nome:nome,numero:af.numero||"",data:novaDataMat||"",plano:plano,valor:valor,diaVenc:diaVenc,
      diasSem:diasSem,horario:horario,prof:prof,canal:af.canal||"",desconto:desconto,promocao:promocao,dataMatricula:novaDataMat});
  }
  
  // Recalcular caixa com novos dias
  D.caixa=gerarCaixa();
  ensureCaixaMes();
  
  // Salvar tudo no Sheets
  await saveMatriculas();
  await saveCaixa();
  
  closeModal();refreshContent();alert(nome.split(" ")[0]+" atualizado!");
}
async function salvarFeedback(nome){

  if(!data||!texto){alert("Preencha data e feedback.");return;}

}

async function cancelarAluno(nome,fixo){

async function confirmarExclusao(nome){
  if(!confirm("EXCLUIR DEFINITIVAMENTE "+nome.split(" ")[0]+"?"))return;
  if(!confirm("Confirma? Histórico também será removido."))return;
  var afIdx=AF.findIndex(function(a){return a.nome===nome;});

  D.pag=D.pag.filter(function(p){return p.aluno!==nome;});
  D.pres=D.pres.filter(function(p){return p.aluno!==nome;});
  D.caixa=D.caixa.filter(function(c){return c.nome!==nome;});

  if(D.feedbacks)D.feedbacks=D.feedbacks.filter(function(f){return f.aluno!==nome;});

// ===== CONTRATOS =====
function calcVencContrato(dataMatricula,plano){
  if(!dataMatricula||plano==="Mensal")return null;
  var p=dataMatricula.split("-");if(p.length!==3)return null;
  var d=new Date(+p[0],+p[1]-1,+p[2]);if(isNaN(d.getTime()))return null;
  var dias=plano==="Trimestral"?90:plano==="Semestral"?180:plano==="Anual"?365:0;
  if(!dias)return null;
  d.setDate(d.getDate()+dias);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function statusContrato(venc,cancelado){
  if(cancelado)return{label:"Cancelado",cls:"br2"};
  if(!venc)return{label:"Em vigor",cls:"bg"};
  var hoje=new Date().toISOString().split("T")[0];
  if(venc<hoje)return{label:"Vencido",cls:"br2"};
  if(venc.slice(0,7)===hoje.slice(0,7))return{label:"Ir\u00e1 vencer",cls:"bam"};
  return{label:"Em vigor",cls:"bg"};
}
async function cancelarContrato(nome){
  var can=eCanc(nome);
  if(!can){if(!confirm("Cancelar contrato de "+nome.split(" ")[0]+"?"))return;}
  if(!D.canc)D.canc=[];
  var ei=D.canc.findIndex(function(c){return c.nome===nome;});
  var novoAtivo=!can;
  var obj={nome:nome,fixo:String(AF.some(function(a){return a.nome===nome;})),ativo:novoAtivo,data:new Date().toISOString().split("T")[0]};
  if(ei>=0)D.canc[ei]=obj;else D.canc.push(obj);
  if(novoAtivo){
    D.caixa=D.caixa.filter(function(c){return c.nome!==nome||isPago(c);});
  }
  D.caixa=gerarCaixa();
  ensureCaixaMes();
  await saveCancelados();
  await saveCaixa();
  refreshContent();
}

// ===== AGENDA =====
function getWeekDates(offset){
  var d=new Date(),day=d.getDay(),monday=new Date(d);
  monday.setDate(d.getDate()-(day===0?6:day-1)+offset*7);
  var dates=[];
  for(var i=0;i<7;i++){var dd=new Date(monday);dd.setDate(monday.getDate()+i);dates.push(dd);}
  return dates;
}
function dateStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

async function salvarEdicaoDesp(idx){
  var d=D.desp[idx];if(!d)return;
  d.descricao=document.getElementById("edd").value;
  d.valor=+document.getElementById("edv2").value||d.valor;
  d.data=document.getElementById("eddt").value;
  d.forma=document.getElementById("edf").value;
  d.tipo=document.getElementById("edt").value;
  d.obs=document.getElementById("edo").value;
  var h=["descricao","valor","data","forma","tipo","obs"];
  await push("despesas",h,h.map(function(k){return String(d[k]||"");}));
  closeModal();refreshContent();
}
async function excluirDespesa(idx){
  var d=D.desp[idx];if(!d)return;
  if(!confirm("Excluir despesa: "+d.descricao+"?"))return;
  D.desp.splice(idx,1);
  var h=["descricao","valor","data","forma","tipo","obs"];
  if(D.desp.length===0){
    await rewriteAba("despesas",h,[]);
  }else{
    var rows=D.desp.map(function(d){return h.map(function(k){return String(d[k]||"");});});
    await rewriteAba("despesas",h,rows);
  }
  refreshContent();
}
async function apagarTodasDespesas(){
  if(!confirm("Apagar TODAS as despesas deste mês?"))return;
  var _ma=mesAtualDesp.split("/"),_dm=String(+_ma[0]).padStart(2,"0"),_da=_ma[1];
  var pfxDesp=_da+"-"+_dm+"-";
  D.desp=D.desp.filter(function(d){return !d.data||!d.data.startsWith(pfxDesp);});
  var h=["descricao","valor","data","forma","tipo","obs"];
  if(D.desp.length===0){
    await rewriteAba("despesas",h,[]);
  }else{
    var rows=D.desp.map(function(d){return h.map(function(k){return String(d[k]||"");});});
    await rewriteAba("despesas",h,rows);
  }
  refreshContent();
}
async function saveDesp(){
  var desc=document.getElementById("dd").value.trim(),val=+document.getElementById("dv").value||0,data=document.getElementById("ddt").value;
  if(!desc||!val){alert2("da","Preencha descri\u00e7\u00e3o e valor.",false);return;}
  var obj={descricao:desc,valor:val,data:data,forma:document.getElementById("df").value,tipo:document.getElementById("dt").value,obs:document.getElementById("do").value||""};
  D.desp.push(obj);
  var h=["descricao","valor","data","forma","tipo","obs"];
  await push("despesas",h,h.map(function(k){return String(obj[k]||"");}));
  alert2("da","Registrado!",true);setTimeout(function(){refreshContent();},800);
}

    +"<select id='ata' onchange='calcAm()'><option value='fixo'>Sal\u00e1rio fixo mensal &mdash; R$ 5.000</option><option value='extra'>Aula fora do expediente &mdash; R$ 45/aula</option></select></div>"
    +"<div id='bqam' style='display:none' class='fi'><label>Qtd. aulas extras</label><input type='number' id='aqam' placeholder='0' min='0' oninput='calcAm()' style='margin-bottom:10px'></div></div>"
    +"<div id='bnat' style='display:none'><div class='fr'>"
    +"<div class='fi'><label>Tipo de aula</label><select id='atn' onchange='calcNat()'><option value='45'>Aula fixa &mdash; R$ 45</option><option value='30'>Aula experimental &mdash; R$ 30</option></select></div>"
    +"<div class='fi'><label>Quantidade</label><input type='number' id='aqn' placeholder='0' min='0' oninput='calcNat()'></div></div></div>"
    +"<div class='fi' style='margin-bottom:10px'><label>Total (R$)</label><input id='atot' readonly style='background:var(--bl);color:var(--brand2);font-weight:600'></div>"
    +"<button class='btn bp bf' onclick='saveAula()'><i class='ti ti-check'></i> Registrar</button></div>"
    +"<div><div class='card' style='margin-bottom:12px'><p class='ct'><i class='ti ti-school'></i> Amanda</p>"
    +"<p style='font-size:28px;font-weight:700;color:var(--brand)'>"+BRL(aT)+"</p>"
    +"<p style='font-size:12px;color:var(--mt)'>"+D.aulas.filter(function(a){return a.prof==="Amanda";}).length+" lan\u00e7amentos</p></div>"
    +"<div class='card c0'><p class='ct'><i class='ti ti-school'></i> Nathalia</p>"
    +"<p style='font-size:28px;font-weight:700;color:var(--pu)'>"+BRL(nT)+"</p>"
    +"<p style='font-size:12px;color:var(--mt)'>"+D.aulas.filter(function(a){return a.prof==="Nathalia";}).length+" lan\u00e7amentos</p></div></div></div>"
    +"<div class='card'>"+(D.aulas.length===0?"<p class='empty'>Nenhum lan\u00e7amento ainda.</p>"
    :"<div class='ox'><table><thead><tr><th>Prof.</th><th>Tipo</th><th>Qtd</th><th>Total</th><th>Data</th></tr></thead><tbody>"+rows+"</tbody></table></div>")+"</div>";

function toggleProf(){
  var isAm=document.getElementById("apr").value==="Amanda";
  document.getElementById("bam").style.display=isAm?"":"none";
  document.getElementById("bnat").style.display=isAm?"none":"";
  document.getElementById("atot").value="";
}
function calcAm(){
  var tipo=document.getElementById("ata").value,qb=document.getElementById("bqam");
  if(tipo==="fixo"){if(qb)qb.style.display="none";document.getElementById("atot").value="5.000,00";return;}
  if(qb)qb.style.display="";
  var qtd=parseInt(document.getElementById("aqam").value)||0;
  document.getElementById("atot").value=(qtd*45).toLocaleString("pt-BR",{minimumFractionDigits:2});
}
function calcNat(){
  var vl=parseFloat(document.getElementById("atn").value)||45,qtd=parseInt(document.getElementById("aqn").value)||0;
  document.getElementById("atot").value=(vl*qtd).toLocaleString("pt-BR",{minimumFractionDigits:2});
}
async function saveAula(){
  var prof=document.getElementById("apr").value,data=document.getElementById("adt").value;
  if(!data){alert2("aa","Preencha a data.",false);return;}
  var desc,qtd,total;
  if(prof==="Amanda"){
    var tipo=document.getElementById("ata").value;
    if(tipo==="fixo"){desc="Sal\u00e1rio fixo";qtd=0;total=5000;}
    else{qtd=parseInt(document.getElementById("aqam").value)||0;desc="Aulas extras";total=qtd*45;}
  }else{
    var vl=parseFloat(document.getElementById("atn").value)||45;
    qtd=parseInt(document.getElementById("aqn").value)||0;
    desc=vl===45?"Aula fixa":"Aula experimental";total=vl*qtd;
  }
  var obj={prof:prof,descricao:desc,qtd:qtd,total:total,data:data};
  D.aulas.push(obj);
  var h=["prof","descricao","qtd","total","data"];
  await push("aulas",h,h.map(function(k){return String(obj[k]||"");}));
  alert2("aa","Registrado!",true);setTimeout(function(){refreshContent();},800);
}

function exportCSV(){
  var t=totP();

  D.pag.forEach(function(p){csv+=p.aluno+","+p.data+","+(p.tipoOp||p.plano||"")+","+p.forma+","+(p.numDoc||"")+","+(+p.bruto).toFixed(2)+","+(+p.liquido).toFixed(2)+"\n";});
  csv+="\nDESPESAS\nDescricao,Valor,Data,Forma,Tipo\n";
  D.desp.forEach(function(d){csv+=d.descricao+","+(+d.valor).toFixed(2)+","+d.data+","+d.forma+","+d.tipo+"\n";});
  var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="academia_"+MES.replace("/","_")+".csv";a.click();
}
