<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia — Gestão v6</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--brand:#1B5F7A;--brand2:#2E8FB3;--bl:#E8F4F8;--gn:#7CB342;--gl:#E8F5E9;--rd:#D32F2F;--rl:#FFEBEE;--pu:#5E35B1;--pl:#F3E5F5;--am:#FFA726;--al:#FFE0B2;--tl:#00897B;--tll:#B2DFDB;--b1:#fff;--b2:#F7F9FA;--b3:#EEF2F5;--br:#E0E8ED;--tx:#1a1a1a;--mt:#7A8FA3;--r:12px;--rs:8px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--b3);min-height:100vh;font-size:14px;color:var(--tx)}
.app{display:flex;min-height:100vh}
.sb{width:220px;background:linear-gradient(135deg,#2B7FA8 0%,#3A95BD 100%);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto;box-shadow:2px 0 12px rgba(27,95,122,.08)}
.sbl{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sblt{font-size:15px;font-weight:600;color:#fff;margin-bottom:2px}
.sbls{font-size:11px;color:rgba(255,255,255,.5)}
.sbsc{padding:14px 10px 4px;font-size:10px;font-weight:600;color:rgba(255,255,255,.35);letter-spacing:.08em;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:1px 8px;border-radius:var(--rs);cursor:pointer;color:rgba(255,255,255,.7);font-size:13px;transition:all .15s;border:none;background:none;width:calc(100% - 16px);text-align:left}
.ni:hover{background:rgba(255,255,255,.08);color:#fff}
.ni.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.ni i{font-size:16px;width:18px}
.nd{width:6px;height:6px;border-radius:50%;background:#EF4444;margin-left:auto}
.sbb{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.1)}
.uc{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--rs);background:rgba(255,255,255,.08)}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.avb{background:#3B82F6;color:#fff}.avp{background:#8B5CF6;color:#fff}
.un{font-size:12px;font-weight:600;color:#fff}.ur{font-size:10px;color:rgba(255,255,255,.5)}
.blo{background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;padding:4px;font-size:16px;margin-left:auto}
.main{flex:1;margin-left:220px;display:flex;flex-direction:column}
.topbar{background:var(--b1);border-bottom:1px solid var(--br);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 4px rgba(0,0,0,.02)}
.tbt{font-size:16px;font-weight:600}.tbs{font-size:12px;color:var(--mt);margin-top:1px}
.content{padding:24px;flex:1}
.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--b1);border:1px solid var(--br);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.03);transition:all .3s ease}
.kpi:hover{box-shadow:0 6px 20px rgba(0,0,0,.06);transform:translateY(-2px)}
.ka{position:absolute;left:0;top:0;bottom:0;width:4px}
.kl{font-size:11px;color:var(--mt);margin-bottom:6px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kv{font-size:20px;font-weight:700;line-height:1}.ks{font-size:11px;color:var(--mt);margin-top:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.card{background:var(--b1);border:1px solid var(--br);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.03);transition:box-shadow .3s ease}
.c0{margin-bottom:0}
.ct{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.ct i{font-size:16px;color:var(--brand2)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.fr4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.fi{display:flex;flex-direction:column}
.fi label{font-size:11px;font-weight:600;color:var(--mt);margin-bottom:4px;letter-spacing:.03em;text-transform:uppercase}
.fi input,.fi select,.fi textarea{width:100%;font-size:13px;padding:10px 12px;border:1px solid var(--br);border-radius:8px;background:var(--b2);color:var(--tx);outline:none;transition:all .2s ease}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:var(--brand2)}
.fi input[readonly]{background:var(--b2)}
.btn{padding:8px 16px;border-radius:var(--rs);font-size:13px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--br);background:var(--b2);color:var(--tx);transition:all .15s}
.btn:hover{background:var(--b3)}
.bp{background:var(--brand);color:#fff;border-color:var(--brand)}.bp:hover{background:var(--brand2)}
.bs{background:var(--gl);color:var(--gn);border-color:var(--gl)}
.bd{background:var(--rl);color:var(--rd);border-color:var(--rl);padding:4px 10px;font-size:12px}
.bsm{padding:5px 10px;font-size:12px}.bf{width:100%;justify-content:center;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 12px;background:var(--b2);border-bottom:1px solid var(--br);color:var(--mt);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--br);color:var(--tx);vertical-align:middle}
tr:last-child td{border-bottom:none}tr:hover td{background:var(--b2)}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;gap:4px}
.bg{background:var(--gl);color:var(--gn)}.br2{background:var(--rl);color:var(--rd)}.bb{background:var(--bl);color:var(--brand)}.bpu{background:var(--pl);color:var(--pu)}.bam{background:var(--al);color:var(--am)}.btl{background:var(--tll);color:var(--tl)}
.empty{text-align:center;padding:2.5rem;color:var(--mt);font-size:13px}
.dv{height:1px;background:var(--br);margin:14px 0}
.pw{background:var(--b2);border-radius:20px;height:8px;overflow:hidden;margin-top:4px}
.pb{height:100%;border-radius:20px}
.sr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--br);font-size:13px}
.sr:last-child{border-bottom:none}.sl{color:var(--mt)}.sv{font-weight:600}
.al2{padding:10px 14px;border-radius:var(--rs);font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.als{background:var(--gl);color:var(--gn)}.ali{background:var(--bl);color:var(--brand)}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--b2);padding:4px;border-radius:var(--rs);width:fit-content;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--mt)}
.tab.active{background:var(--b1);color:var(--tx)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.acard{background:var(--b2);border:1px solid var(--br);border-radius:var(--rs);padding:10px 12px;text-align:center;cursor:pointer;transition:all .15s;user-select:none}
.acard:hover{border-color:var(--brand2)}
.acard.presente{background:var(--gl);border-color:var(--gn)}
.acard.falta{background:var(--rl);border-color:var(--rd)}
.acard.reagendado{background:var(--al);border-color:var(--am)}
.an{font-size:11px;font-weight:600;margin-bottom:3px;line-height:1.3}.as{font-size:10px;color:var(--mt)}
.mbadge{background:var(--bl);color:var(--brand);font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;display:flex;align-items:center;gap:5px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.lpage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1B3A5C,#2E6DA4);background-image:url('clinic-bg.jpg');background-size:cover;background-position:center;background-attachment:fixed;background-blend-mode:overlay}
.lpage::before{content:'';position:absolute;inset:0;background:rgba(27,58,92,0.75);z-index:0}
.lcard{position:relative;z-index:1}
.lcard{background:#fff;border-radius:var(--r);padding:2.5rem;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.lbrand{font-size:24px;font-weight:700;color:var(--brand);margin-bottom:4px}
.lsub{font-size:13px;color:var(--mt);margin-bottom:28px}
.lov{position:fixed;inset:0;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;z-index:999;font-size:14px;color:var(--brand);gap:10px;font-weight:600}
.spin{width:20px;height:20px;border:2px solid var(--bl);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes piscar{0%,100%{opacity:1}50%{opacity:.4}}
.alerta-contrato{animation:piscar 1.5s infinite}
.ox{overflow-x:auto}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:var(--r);padding:24px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.modal-lg{width:700px}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.ci{display:grid;grid-template-columns:90px 1fr 70px 90px 90px 100px 135px;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--br);font-size:12px}
.ci:hover{background:var(--b2)}
.ci-h{font-weight:600;color:var(--mt);font-size:11px;text-transform:uppercase;background:var(--b2)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE}
.agenda-grid{display:grid;border:1px solid var(--br);border-radius:var(--rs);overflow:hidden;background:var(--b1)}
.agenda-header{background:var(--brand);color:#fff;padding:12px;font-size:16px;font-weight:600;text-align:center;border-right:1px solid rgba(255,255,255,.15)}
.agenda-time{background:var(--b2);padding:10px 12px;font-size:15px;color:var(--mt);border-right:1px solid var(--br);border-bottom:1px solid var(--br);text-align:right;font-weight:600;white-space:nowrap;min-width:70px}
.agenda-cell{border-right:1px solid var(--br);border-bottom:1px solid var(--br);padding:8px;min-height:90px;position:relative;cursor:pointer}
.agenda-cell:hover{background:var(--bl)}
.agenda-event{border-radius:4px;padding:6px 10px;font-size:14px;font-weight:600;margin:4px 0;cursor:pointer;line-height:1.5;overflow:visible;white-space:normal;text-overflow:ellipsis}
.ev-amanda{background:#DBEAFE;color:#1D4ED8;border-left:3px solid #2563EB}
.ev-nathalia{background:#EDE9FE;color:#6D28D9;border-left:3px solid #7C3AED}
.cont-row{display:grid;grid-template-columns:1fr 80px 80px 90px 100px 160px;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--br);font-size:12px}
.cont-row:hover{background:var(--b2)}
.cont-h{font-weight:600;color:var(--mt);font-size:11px;text-transform:uppercase;background:var(--b2)}
</style>
</head>

function fd(s){
  if(!s||s===""||s==="undefined"||s===null)return "—";
  var d;
  if(typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s)){var p=s.split("-");d=new Date(+p[0],+p[1]-1,+p[2]);}

async function loadAba(aba){
  try{
    var r=await fetch(SURL+"?aba="+encodeURIComponent(aba),{mode:"cors",headers:{"Accept":"application/json"}});
    var rows=await r.json();
    if(!Array.isArray(rows)||rows.length<2)return[];
    var h=rows[0];
    return rows.slice(1).map(function(row){
      var obj={};
      h.forEach(function(k,i){
        var v=row[i];
        var vs=String(v||"").trim();
        var vl=vs.toLowerCase();
        if(vl==="true")obj[k]=true;
        else if(vl==="false")obj[k]=false;
        // Limpar datas ISO (ex: 2026-01-19T03:00:00.000Z → 2026-01-19)
        else if(/^\d{4}-\d{2}-\d{2}T/.test(vs))obj[k]=vs.substring(0,10);
        else if(v!==""&&v!==null&&v!==undefined&&vs!==""&&!isNaN(v))obj[k]=+v;
        else obj[k]=v||"";
      });
      return obj;
    });
  }catch(e){console.error("loadAba error:",aba,e);return null;}
}

function dataVencMes(diaVenc,ano,mes){
  // Constrói YYYY-MM-DD para o dia escolhido pelo aluno no mês/ano dados
  // Se o dia não existe no mês (ex: dia 31 em fevereiro), usa o último dia
  var ultimoDia=new Date(ano,mes,0).getDate();
  var dia=Math.min(+diaVenc,ultimoDia);
  return ano+"-"+String(mes).padStart(2,"0")+"-"+String(dia).padStart(2,"0");
}

function gerarCaixa(){
  var ano=MES_ANO.a,mes=MES_ANO.m;
  var pfxMes=ano+"-"+String(mes).padStart(2,"0");
  var ultimoDiaMes=new Date(ano,mes,0);
  var vistos=new Set();
  var lista=[];
  ativos().forEach(function(a){
    if(vistos.has(a.nome))return;
    vistos.add(a.nome);
    // Nao gerar caixa se contrato ainda nao iniciou neste mes
    if(a.dataMatricula){var dm=new Date(a.dataMatricula+"T00:00:00");if(dm>ultimoDiaMes)return;}
    var dv=dataVencMes(a.diaVenc,ano,mes);
    var pgList=D.pag.filter(function(p){return p.aluno===a.nome&&p.data&&p.data.startsWith(pfxMes);});
    var pago=pgList.length>0;
    var inf=pago?pgList[0]:null;
    lista.push({nome:a.nome,valor:a.valor,plano:a.plano,dataVenc:dv,pago:pago,dataPag:inf?inf.data:"",numDoc:"",formaPag:inf?inf.forma:"",diasSem:a.diasSem||""});
  });
  return lista;
}

function ensureCaixaMes(){
  var ano=MES_ANO.a,mes=MES_ANO.m,pfx=mesAtualPfx();
  // Remover do caixa qualquer entrada de aluno cancelado
  D.caixa=D.caixa.filter(function(c){return!eCanc(c.nome);});
  // Remover entradas geradas antes do inicio do contrato
  D.caixa=D.caixa.filter(function(c){
    if(!c.dataVenc)return true;
    var mat=D.mat.find(function(m){return m.nome===c.nome;});
    if(!mat||!mat.dataMatricula)return true;
    var inicioContrato=new Date(mat.dataMatricula+"T00:00:00");
    var mesEntrada=new Date(c.dataVenc.substring(0,7)+"-01T00:00:00");
    return mesEntrada>=new Date(mat.dataMatricula.substring(0,7)+"-01T00:00:00");
  });
  // Remover duplicatas (manter só 1 por nome/mês)
  var vistos=new Set();
  D.caixa=D.caixa.filter(function(c){
    if(!c.dataVenc)return true;
    var chave=c.nome+"|"+c.dataVenc.substring(0,7);
    if(vistos.has(chave))return false;
    vistos.add(chave);
    return true;
  });
  // Adicionar alunos ativos que ainda não têm entrada no mês
  var _ultimoDiaMesAtual=new Date(ano,mes,0);
  ativos().forEach(function(a){
    // Nao criar entrada se contrato nao iniciou ainda neste mes
    if(a.dataMatricula){var _dm=new Date(a.dataMatricula+"T00:00:00");if(_dm>_ultimoDiaMesAtual)return;}
    var jaTem=D.caixa.find(function(c){return c.nome===a.nome&&c.dataVenc&&c.dataVenc.startsWith(pfx);});
    if(!jaTem){
      var dv=dataVencMes(a.diaVenc,ano,mes);
      var pfxMes=pfx;
      var pgList=D.pag.filter(function(p){return p.aluno===a.nome&&p.data&&p.data.startsWith(pfxMes);});
      var pago=pgList.length>0;
      var inf=pago?pgList[0]:null;
      D.caixa.push({nome:a.nome,valor:a.valor,plano:a.plano,dataVenc:dv,pago:pago,dataPag:inf?inf.data:"",numDoc:"",formaPag:inf?inf.forma:"",diasSem:a.diasSem||""});
    }
  });
}

async function syncAll(){
  syncing=true;
  showLov(true);
  var cats=["pag","mat","desp","aulas","exp","caixa","canc","feedbacks","agenda","historico","perfis","leads"];
  var abas=["pagamentos","matriculas","despesas","aulas","experimentais","caixa","cancelados","feedbacks","agenda","historico","perfis","leads"];
  for(var i=0;i<cats.length;i++){
    try{
      var rows=await loadAba(abas[i]);
      if(rows&&rows.length>0){
        if(abas[i]==="agenda"){
          // Deduplicar agenda: manter só o primeiro por aluno+data+hora
          var vistos={};
          rows=rows.filter(function(r){
            var k=(r.aluno||r.nome||"")+"_"+r.data+"_"+r.hora;
            if(vistos[k])return false;
            vistos[k]=true;
            // Normalizar campo nome→aluno se vier do formato antigo
            if(!r.aluno&&r.nome){r.aluno=r.nome;delete r.nome;}
            return true;
          });
        }
        D[cats[i]]=rows;
      }
    }
    catch(e){console.warn("Falha ao carregar aba:",abas[i],e);}
  }
  // Criar registro de 1ª matrícula no histórico para quem ainda não tem
  if(!D.historico)D.historico=[];
  var hh=["nome","plano","valor","diaVenc","prof","dataMatricula","dataRenovacao","vencimento","evento","dataEvento"];
  var todosList=todosObj();
  for(var i=0;i<todosList.length;i++){
    var a=todosList[i];
    var jaTem=D.historico.find(function(h){return h.nome===a.nome&&h.evento==="matricula";});
    if(!jaTem&&a.dataMatricula){
      var hObj={nome:a.nome,plano:a.plano,valor:a.valor,diaVenc:a.diaVenc,prof:a.prof,
        dataMatricula:a.dataMatricula,dataRenovacao:"",
        vencimento:calcVencContrato(a.dataMatricula,a.plano)||"",
        evento:"matricula",dataEvento:a.dataMatricula};
      D.historico.push(hObj);
    }
  }
  if(D.caixa.length===0){D.caixa=gerarCaixa();}
  ensureCaixaMes();
  syncing=false;
  syncOk=true;showLov(false);
}

function getAcoesLeadsCard(){
  var hoje=new Date().toISOString().split("T")[0];
  var acoes=(D.leads||[]).filter(function(l){
    if(!l.proximaacao)return false;
    var dataProx=new Date(l.proximaacao+"T00:00:00"),dataHoje=new Date(hoje+"T00:00:00");
    return dataProx<=dataHoje;
  });
  if(acoes.length===0)return "";
  var items=acoes.map(function(l,idx){
    var dataProx=new Date(l.proximaacao+"T00:00:00"),dataHoje=new Date(hoje+"T00:00:00");
    var diff=Math.floor((dataProx-dataHoje)/(1000*60*60*24));
    var statusLabel=diff<0?"⚠️ "+Math.abs(diff)+" dias atrás":"🟡 Hoje";

function calcDesc(base){
  var sel=document.getElementById("bds").value,wrap=document.getElementById("bdc"),vEl=document.getElementById("bv");
  if(sel==="c"){wrap.style.display="";var cv=parseFloat(document.getElementById("bdcv").value)||0;vEl.value=(base-cv).toFixed(2);}
  else{wrap.style.display="none";vEl.value=(base*(1-sel/100)).toFixed(2);}
  calcLiqB();
}
function calcLiqB(){
  var b=parseFloat(document.getElementById("bv").value)||0,f=document.getElementById("bf").value||"PIX",el=document.getElementById("bl");
  var liq=lq(b,f),taxa=b-liq;
  if(el)el.value=BRL(liq);
  var elTaxa=document.getElementById("tx-taxa"),elLiq=document.getElementById("tx-liquido");
  if(elTaxa)elTaxa.textContent="-"+BRL(taxa);
  if(elLiq)elLiq.textContent=BRL(liq);

async function excluirTodosPagamentos(){
  if(!confirm("Excluir TODOS os pagamentos?"))return;
  if(!confirm("Confirma? Esta ação não pode ser desfeita."))return;
  D.pag=[];
  // Zerar status pago no caixa
  D.caixa.forEach(function(c){c.pago=false;c.dataPag="";c.numDoc="";c.formaPag="";});
  await _savePagamentosNow();
  await _saveCaixaNow();
  refreshContent();
}
async function excluirPagamento(idx){
  var p=D.pag[idx];
  if(!p)return;
  if(!confirm("Excluir pagamento de "+p.aluno.split(" ")[0]+" ("+BRL(p.bruto)+" em "+fd(p.data)+")?"))return;
  // Reverter status no caixa
  var pfxMes=p.data?p.data.substring(0,7):"";
  var cx=D.caixa.find(function(c){return c.nome===p.aluno&&c.dataVenc&&c.dataVenc.startsWith(pfxMes);});
  if(cx&&isPago(cx)){
    // Checar se há outro pagamento no mesmo mês para este aluno
    var outrosPag=D.pag.filter(function(x,xi){return xi!==idx&&x.aluno===p.aluno&&x.data&&x.data.startsWith(pfxMes);});
    if(outrosPag.length===0){cx.pago=false;cx.dataPag="";cx.numDoc="";cx.formaPag="";}
  }
  D.pag.splice(idx,1);
  // Reescrever aba pagamentos inteira
  await _savePagamentosNow();
  // Salvar caixa atualizado
  await _saveCaixaNow();
  refreshContent();
}
function prefillAluno(){
  var nome=document.getElementById("pal").value,d=getDados(nome);
  if(d&&d.valor){document.getElementById("pt").value=d.valor;calcBruto();}
}
function calcBruto(){
  var t=parseFloat(document.getElementById("pt").value)||0;
  var dc=parseFloat(document.getElementById("pdc").value)||0;
  var dp=parseFloat(document.getElementById("pdp")?document.getElementById("pdp").value:0)||0;
  var base=t-dc;
  var b=base*(1-dp/100);
  document.getElementById("pb").value=b>0?b.toFixed(2):"";atualizaLiq();
}
function atualizaLiq(){
  var b=parseFloat(document.getElementById("pb").value)||0,f=document.getElementById("pf").value||"PIX",el=document.getElementById("pliq");
  if(el)el.value=lq(b,f).toLocaleString("pt-BR",{minimumFractionDigits:2});
}
async function savePag(){
  var aluno=document.getElementById("pal").value,data=document.getElementById("pd").value;
  var bruto=+document.getElementById("pb").value||0,forma=document.getElementById("pf").value;
  if(!data||!bruto){alert2("pa","Preencha data e valor.",false);return;}
  var liquido=lq(bruto,forma);
  var plano=document.getElementById("ppl").value;
  var pfxMes=data.substring(0,7);
  var tabela=+document.getElementById("pt").value||0;
  var desconto=+document.getElementById("pdc").value||0;
  var descPont=+document.getElementById("pdp").value||0;
  var obj={aluno:aluno,data:data,tabela:tabela,desconto:desconto,descontoPontualidade:descPont,bruto:bruto,liquido:liquido,forma:forma,plano:plano,banco:"SICREDI"};
  D.pag.push(obj);
  var cx=D.caixa.find(function(c){return c.nome===aluno&&c.dataVenc&&c.dataVenc.startsWith(pfxMes)&&!isPago(c);});
  if(cx){cx.pago=true;cx.dataPag=data;cx.formaPag=forma;}
  await savePagamentos();
  await saveCaixa();
  alert2("pa","Pagamento registrado! Caixa atualizado.",true);
  setTimeout(function(){refreshContent();},800);
}

// ===== CONTRATOS =====
function calcVencContrato(dataMatricula,plano){
  if(!dataMatricula||String(dataMatricula).trim()===""||plano==="Mensal")return null;
  var dm=String(dataMatricula).trim();
  var d;
  if(/^\d{4}-\d{2}-\d{2}$/.test(dm)){
    var p=dm.split("-");d=new Date(+p[0],+p[1]-1,+p[2]);
  } else if(/^\d{2}\/\d{2}\/\d{4}$/.test(dm)){
    var p=dm.split("/");d=new Date(+p[2],+p[1]-1,+p[0]);
  } else {return null;}
  if(isNaN(d.getTime()))return null;
  var dias=plano==="Trimestral"?90:plano==="Semestral"?180:plano==="Anual"?360:0;
  if(!dias)return null;
  d.setDate(d.getDate()+dias);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function statusContrato(venc,cancelado){
  if(cancelado)return{label:"Cancelado",cls:"br2"};
  if(!venc)return{label:"Em vigor",cls:"bg"};
  var hoje=new Date().toISOString().split("T")[0];
  if(venc<hoje)return{label:"Vencido",cls:"br2"};
  if(venc.slice(0,7)===hoje.slice(0,7))return{label:"Ir\u00e1 vencer",cls:"bam"};
  return{label:"Em vigor",cls:"bg"};
}
async function cancelarContrato(nome){
  var can=eCanc(nome);
  if(!can){if(!confirm("Cancelar contrato de "+nome.split(" ")[0]+"?"))return;}
  if(!D.canc)D.canc=[];
  var ei=D.canc.findIndex(function(c){return c.nome===nome;});
  var novoAtivo=!can;
  var obj={nome:nome,fixo:String(AF.some(function(a){return a.nome===nome;})),ativo:novoAtivo,data:new Date().toISOString().split("T")[0]};
  if(ei>=0)D.canc[ei]=obj;else D.canc.push(obj);
  
  // SE CANCELANDO: remover aulas fixas do aluno
  if(!novoAtivo){
    if(D.agenda){
      D.agenda=D.agenda.filter(function(a){
        // Mantém se: não é do aluno OU é avulso (não é fixo)
        return a.aluno!==nome || a.frequencia!=="fixo";
      });
    }
  }
  
  if(novoAtivo){
    D.caixa=D.caixa.filter(function(c){return c.nome!==nome||isPago(c);});
  }
  D.caixa=gerarCaixa();
  ensureCaixaMes();
  await saveCancelados();
  await saveCaixa();
  if(!novoAtivo) await saveAgenda(); // Salvar agenda se removeu aulas
  refreshContent();
}

function getWeekDates(offset){
  var d=new Date(),day=d.getDay(),monday=new Date(d);
  monday.setDate(d.getDate()-(day===0?6:day-1)+offset*7);
  var dates=[];
  for(var i=0;i<7;i++){var dd=new Date(monday);dd.setDate(monday.getDate()+i);dates.push(dd);}
  return dates;
}

function toggleProf(){
  var isAm=document.getElementById("apr").value==="Amanda";
  document.getElementById("bam").style.display=isAm?"":"none";
  document.getElementById("bnat").style.display=isAm?"none":"";
  document.getElementById("atot").value="";

function calcAm(){
  var tipo=document.getElementById("ata").value,qb=document.getElementById("bqam");
  if(tipo==="fixo"){if(qb)qb.style.display="none";document.getElementById("atot").value="5.000,00";return;}
  if(qb)qb.style.display="";
  var qtd=parseInt(document.getElementById("aqam").value)||0;
  document.getElementById("atot").value=(qtd*45).toLocaleString("pt-BR",{minimumFractionDigits:2});
}
function calcNat(){
  var vl=parseFloat(document.getElementById("atn").value)||45,qtd=parseInt(document.getElementById("aqn").value)||0;
  document.getElementById("atot").value=(vl*qtd).toLocaleString("pt-BR",{minimumFractionDigits:2});
}
async function saveAula(){
  var prof=document.getElementById("apr").value,data=document.getElementById("adt").value;
  if(!data){alert2("aa","Preencha a data.",false);return;}
  var desc,qtd,total;
  if(prof==="Amanda"){
    var tipo=document.getElementById("ata").value;
    if(tipo==="fixo"){desc="Sal\u00e1rio fixo";qtd=0;total=5000;}
    else{qtd=parseInt(document.getElementById("aqam").value)||0;desc="Aulas extras";total=qtd*45;}
  }else{
    var vl=parseFloat(document.getElementById("atn").value)||45;
    qtd=parseInt(document.getElementById("aqn").value)||0;
    desc=vl===45?"Aula fixa":"Aula experimental";total=vl*qtd;
  }
  var obj={prof:prof,descricao:desc,qtd:qtd,total:total,data:data};
  D.aulas.push(obj);
  var h=["prof","descricao","qtd","total","data"];
  await push("aulas",h,h.map(function(k){return String(obj[k]||"");}));
  alert2("aa","Registrado!",true);setTimeout(function(){refreshContent();},800);
}

function exportDocx(){
  if(!mesAtualRel){var _d=new Date();mesAtualRel=String(_d.getMonth()+1).padStart(2,"0")+"/"+_d.getFullYear();}
  var _ma=mesAtualRel.split("/"),_rm=String(+_ma[0]).padStart(2,"0"),_ra=_ma[1];
  var pfxRel=_ra+"-"+_rm+"-";
  
  var pagRel=D.pag.filter(function(p){return p.data&&p.data.startsWith(pfxRel);});
  var t={b:pagRel.reduce(function(a,p){return a+(+p.bruto||0);},0),l:pagRel.reduce(function(a,p){return a+(+p.liquido||0);},0)};
  var royalties=(t.b*0.075).toFixed(2);
  
  var atvList=ativosNoMes(_ra+"-"+_rm);
  var plMensal=atvList.filter(function(a){return(a.plano||"").toLowerCase()==="mensal";}).length;
  var plTrimestral=atvList.filter(function(a){return(a.plano||"").toLowerCase()==="trimestral";}).length;
  var plSemestral=atvList.filter(function(a){return(a.plano||"").toLowerCase()==="semestral";}).length;
  var plAnual=atvList.filter(function(a){return(a.plano||"").toLowerCase()==="anual";}).length;
  var totalAtivos=atvList.length;
  
  var mesesNomes=["","janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  var partes=mesAtualRel.split("/");
  var mesFormatado=mesesNomes[+partes[0]]+"/"+partes[1];
  var mesExtenso=mesesNomes[+partes[0]].charAt(0).toUpperCase()+mesesNomes[+partes[0]].slice(1)+" de "+partes[1];
  
  // Decodificar template base64
  var binaryString=atob(DOCX_TEMPLATE_B64);
  var bytes=new Uint8Array(binaryString.length);
  for(var i=0;i<binaryString.length;i++){bytes[i]=binaryString.charCodeAt(i);}
  
  // Carregar com JSZip
  JSZip.loadAsync(bytes).then(function(zip){
    // Ler document.xml
    return zip.file("word/document.xml").async("text").then(function(docXml){
      // Substituir placeholders (busca por padrões comuns)
      var replacements={
        "ABRIL 2026":("ABRIL "+partes[1]).toUpperCase(),
        "abril de 2026":mesExtenso,
        "abril/2026":mesFormatado.toUpperCase(),
        "abril":partes[0]==="04"?mesesNomes[+partes[0]]:mesesNomes[+partes[0]],
        "2026":partes[1],
        "R$6.067,09":BRL(t.b),
        "6.067,09":t.b.toFixed(2),
        "R$5.807,09":BRL(Math.floor(t.b*0.95)),
        "R$260,00":BRL(t.b*0.05),
        "07 de maio":""+new Date().getDate()+" de "+mesesNomes[new Date().getMonth()+1],
        "Alunos ativos no plano mensal: 06":"Alunos ativos no plano mensal: "+plMensal,
        "Alunos ativos no plano trimestral: 03":"Alunos ativos no plano trimestral: "+plTrimestral,
        "Alunos ativos no plano semestral: 01":"Alunos ativos no plano semestral: "+plSemestral,
        "Alunos ativos no plano anual: 02":"Alunos ativos no plano anual: "+plAnual,
        "Alunos ativos: 12":"Alunos ativos: "+totalAtivos
      };
      
      var newXml=docXml;
      for(var key in replacements){
        var regex=new RegExp(key,"g");
        newXml=newXml.replace(regex,replacements[key]);
      }
      
      // Atualizar arquivo
      zip.file("word/document.xml",newXml);
      
      // Gerar novo DOCX
      return zip.generateAsync({type:"blob"});
    }).then(function(blob){
      // Download
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      a.href=url;
      a.download="Declaracao_Faturamento_"+mesFormatado+".docx";
      a.click();
      URL.revokeObjectURL(url);
    });
  }).catch(function(err){
    alert("Erro ao gerar documento: "+err.message);
  });
}

function gerarCalendarioMes(mes,ano){
  var mesesNomes=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  var diasNomes=["Dom","Seg","Ter","Qua","Qui","Sex","Sab"];
  
  var primeroDia=new Date(ano,mes,1);
  var ultimoDia=new Date(ano,mes+1,0);
  var diasDoMes=ultimoDia.getDate();
  var diaInicio=primeroDia.getDay();
  
  var html="<div>";
  html+="<div style='text-align:center;font-weight:600;margin-bottom:8px;font-size:12px'>"+mesesNomes[mes]+" "+ano+"</div>";
  html+="<div style='display:grid;grid-template-columns:repeat(7,1fr);gap:2px'>";
  
  // Headers dos dias
  for(var d=0;d<7;d++){
    html+="<div style='text-align:center;font-weight:600;font-size:10px;padding:4px;color:var(--mt)'>"+diasNomes[d].slice(0,1)+"</div>";
  }
  
  // Células vazias
  for(var v=0;v<diaInicio;v++){
    html+="<div style='height:28px'></div>";
  }
  
  // Dias do mês
  var hoje=new Date().toISOString().split("T")[0];
  for(var dia=1;dia<=diasDoMes;dia++){
    var dataStr=ano+"-"+String(mes+1).padStart(2,"0")+"-"+String(dia).padStart(2,"0");
    var isHoje=dataStr===hoje;
    var aulasDodia=(D.agenda||[]).filter(function(a){return a.data===dataStr;}).length;
    
    html+="<div onclick='abrirDiaAgenda(\""+dataStr+"\")' style='padding:3px;border:1px solid var(--br);border-radius:4px;text-align:center;cursor:pointer;background:"+(isHoje?"var(--brand2);color:#fff":"var(--b2)")+";transition:all .2s;height:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:500'>";
    html+="<div>"+dia+"</div>";
    if(aulasDodia>0){
      html+="<div style='font-size:8px;opacity:.7'>"+aulasDodia+"</div>";
    }
    html+="</div>";
  }
  
  html+="</div></div>";
  return html;
}

// === PRESENÇA ===
async function marcarPresenca(idx,tipo){
  if(!D.agenda[idx])return;
  var aula=D.agenda[idx];
  if(tipo==="falta"){
    abrirModalFalta(idx);
  } else {
    aula.presenca="presenca";
    var prof=aula.professora;
    var tipoAula=aula.tipo;
    aula.cor=tipoAula==="experimental"?"#7CB342":(prof==="Amanda"?"#2E8FB3":"#5E35B1");
    var ok=await saveAgenda();
    if(ok){closeModal();renderAgendaView(agendaView,null);alert("Presença registrada!");}
    else{alert("Erro ao salvar presença.");}
  }
}

function abrirModalFalta(idx){

  modal.innerHTML+="<div style='background:#FFEBEE;border-left:4px solid #D32F2F;padding:12px;border-radius:4px;margin-bottom:16px'><p style='color:#D32F2F;font-weight:600;margin:0;font-size:13px'>"+aula.aluno+"</p><p style='color:#D32F2F;margin:4px 0 0;font-size:12px'>"+aula.data.split('-').reverse().join('/')+" às "+aula.hora+"</p></div>";

  overlay.appendChild(modal);

async function confirmarReagendamento(idx){
  var aula=D.agenda[idx];
  if(!aula)return;
  var novaData=document.getElementById("modal-reagenda-data").value;
  var novaHora=document.getElementById("modal-reagenda-hora").value;
  if(!novaData||!novaHora){alert("Preencha data e hora.");return;}
  aula.presenca="falta";
  aula.cor="#D32F2F";
  if(!aula.notas)aula.notas="";
  if(!aula.notas.includes("[REAGENDADO]"))aula.notas="[REAGENDADO] "+aula.notas;
  
  if(!D.agenda)D.agenda=[];
  D.agenda.push({
    aluno:aula.aluno+" REAGENDADO",
    data:novaData,
    hora:novaHora,
    duracao:aula.duracao,
    professora:aula.professora,
    tipo:aula.tipo,
    frequencia:aula.frequencia,
    dataFim:aula.dataFim,
    status:"ativo",
    notas:"Aula reagendada de "+aula.data,
    cor:"#FFA726",
    presenca:""
  });
  
  var ok=await saveAgenda();
  if(ok){
    document.querySelectorAll(".modal-overlay").forEach(function(el){el.remove();});
    closeModal();
    renderAgendaView(agendaView,null);
    alert("Reagendamento salvo!");
  } else {
    alert("Erro ao salvar reagendamento.");
  }
}

function alunosHtml(){
  var todos=todosObj().sort(function(a,b){return a.nome<b.nome?-1:1;});
  var atv=todos.filter(function(a){return!eCanc(a.nome);});
  var can=todos.filter(function(a){return eCanc(a.nome);});
  var pfx=mesAtualPfx();
  function getStatus(a){
    var pagAtual=D.pag.find(function(p){return p.aluno===a.nome&&p.data&&p.data.startsWith(pfx);});
    if(pagAtual)return "ok";
    var caixaEntry=D.caixa.find(function(c){return c.nome===a.nome&&c.dataVenc&&c.dataVenc.startsWith(pfx);});
    if(!caixaEntry)return "ok";
    var hoje=new Date().toISOString().split("T")[0];
    if(caixaEntry.dataVenc<hoje)return "atrasado";
    return "pendente";
  }
  function diasAtraso(a){
    var caixaEntry=D.caixa.find(function(c){return c.nome===a.nome&&c.dataVenc&&c.dataVenc.startsWith(pfx);});
    if(!caixaEntry||!caixaEntry.dataVenc)return 0;
    var hoje=new Date(),venc=new Date(caixaEntry.dataVenc+"T00:00:00");
    return Math.max(0,Math.floor((hoje-venc)/(1000*60*60*24)));
  }
  var totalAtivos=atv.length;
  var totalOk=atv.filter(function(a){return getStatus(a)==="ok";}).length;
  var totalAtraso=atv.filter(function(a){return getStatus(a)==="atrasado";}).length;
  var totalPend=atv.filter(function(a){return getStatus(a)==="pendente";}).length;
  var cardsAtivos=atv.map(function(a){
    var st=getStatus(a);
    var dias=st==="atrasado"?diasAtraso(a):0;
    var perfil=getPerfil(a.nome);
    var avatarLetras=a.nome.split(" ").slice(0,2).map(function(w){return w[0];}).join("");
    var corAvatar=st==="ok"?"background:#E8F5E9;color:#2E7D32":st==="atrasado"?"background:#FFEBEE;color:#C62828":"background:#FFF8E1;color:#E65100";
    var badgeHtml=st==="ok"?"<span class='badge bg' style='font-size:10px'><i class='ti ti-check'></i> Em dia</span>"
      :st==="atrasado"?"<span class='badge br2' style='font-size:10px'><i class='ti ti-alert-circle'></i> "+dias+" dia"+(dias===1?"":"s")+" atr.</span>"
      :"<span class='badge bam' style='font-size:10px'><i class='ti ti-clock'></i> Pendente</span>";
    return "<div style='background:var(--b1);border:1px solid var(--br);border-radius:var(--rs);padding:14px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:8px'"
      +" onmouseenter=\"this.style.borderColor='var(--brand2)';this.style.boxShadow='0 4px 16px rgba(0,0,0,.07)'\""
      +" onmouseleave=\"this.style.borderColor='var(--br)';this.style.boxShadow=''\""
      +" onclick=\"abrirPerfilAluno('"+a.nome.replace(/'/g,"\\'")+"')\">"
      +"<div style='display:flex;align-items:center;gap:10px'>"
      +"<div style='width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;"+corAvatar+"'>"+avatarLetras+"</div>"
      +"<div style='flex:1;min-width:0'>"
      +"<p style='font-size:12px;font-weight:700;color:var(--tx);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>"+a.nome.split(" ").slice(0,3).join(" ")+"</p>"
      +"<p style='font-size:11px;color:var(--mt);margin:2px 0 0'>Nº "+a.numero+"</p>"
      +"</div>"
      +"</div>"
      +"<div style='display:flex;justify-content:space-between;align-items:center'>"
      +"<span class='badge bb' style='font-size:10px'>"+a.plano+"</span>"
      +badgeHtml
      +"</div>"
      +"<div style='font-size:11px;color:var(--mt)'>"+a.prof+" &middot; "+a.diasSem+"</div>"
      +"</div>";
  }).join("");
  var cardsCan=can.map(function(a){
    return "<div style='background:var(--b1);border:1px solid var(--br);border-radius:var(--rs);padding:12px;cursor:pointer;opacity:.7'"
      +" onclick=\"abrirPerfilAluno('"+a.nome.replace(/'/g,"\\'")+"')\">"
      +"<p style='font-size:12px;font-weight:700;color:var(--tx);margin:0 0 4px'>"+a.nome.split(" ").slice(0,3).join(" ")+"</p>"
      +"<div style='display:flex;gap:6px;align-items:center'>"
      +"<span class='badge br2' style='font-size:10px'>Cancelado</span>"
      +"<span class='badge bb' style='font-size:10px'>"+a.plano+"</span>"
      +"</div></div>";
  }).join("");
  return "<div class='kg'>"
    +"<div class='kpi'><div class='ka' style='background:var(--brand2)'></div><p class='kl'>Alunos Ativos</p><p class='kv' style='color:var(--brand2)'>"+totalAtivos+"</p><p class='ks'>total matriculados</p></div>"
    +"<div class='kpi'><div class='ka' style='background:var(--gn)'></div><p class='kl'>Em Dia</p><p class='kv' style='color:var(--gn)'>"+totalOk+"</p><p class='ks'>mensalidade quitada</p></div>"
    +"<div class='kpi'><div class='ka' style='background:var(--am)'></div><p class='kl'>Pendente</p><p class='kv' style='color:var(--am)'>"+totalPend+"</p><p class='ks'>aguardando pgto</p></div>"

}

function switchPTab(n){
  [1,2,3,4].forEach(function(i){
    var el=document.getElementById("ptab-"+i);if(el)el.style.display=n===i?"":"none";
    var btn=document.getElementById("ptab"+i);if(btn)btn.className="tab"+(n===i?" active":"");
  });
}

async function salvarPerfil(nome){
  if(!D.perfis)D.perfis=[];
  var idx=D.perfis.findIndex(function(p){return p.nome===nome;});
  var obj={
    nome:nome,
    dataNasc:document.getElementById("pfNasc").value||"",
    nomePai:document.getElementById("pfPai").value||"",
    nomeMae:document.getElementById("pfMae").value||"",
    telefone:document.getElementById("pfTel").value||"",
    email:document.getElementById("pfEmail").value||"",
    obs:document.getElementById("pfObs").value||""
  };

function leadsHtml(){
  var leads=(D.leads||[]).filter(function(l){return l.status!=="finalizado";}).sort(function(a,b){return (a.crianca||"").localeCompare(b.crianca||"");});
  var finalizados=(D.leads||[]).filter(function(l){return l.status==="finalizado";}).sort(function(a,b){return (a.crianca||"").localeCompare(b.crianca||"");});
  var hoje=new Date().toISOString().split("T")[0];
  function getStatusProxAcao(proxacao){
    if(!proxacao)return {classe:"badge-futuro",texto:"—"};
    var dataProx=new Date(proxacao+"T00:00:00"),dataHoje=new Date(hoje+"T00:00:00");
    var diff=Math.floor((dataProx-dataHoje)/(1000*60*60*24));
    if(diff<0)return {classe:"badge-atrasado",texto:"⚠️ "+Math.abs(diff)+"d"};
    if(diff===0)return {classe:"badge-hoje",texto:"🟡 Hoje"};
    return {classe:"badge-futuro",texto:"Em "+diff+"d"};
  }
  var rowsHtml=leads.map(function(l,idx){
    var status=getStatusProxAcao(l.proximaacao);
    var anotLabel=l.anotacoes?"("+l.anotacoes.substring(0,20)+"...)":"Clique...";
    return "<tr"+(status.classe==="badge-atrasado"?" class='alerta-contrato'":"")+"><td><strong>"+l.crianca+"</strong></td><td>"+(l.responsavel||"")+"</td><td>"+(l.telefone||"")+"</td><td><span class='badge badge-"+(l.pediuvalor==="sim"?"sim":"nao")+"'>"+(l.pediuvalor==="sim"?"Sim":"Não")+"</span></td><td><span class='badge badge-"+(l.marcoualula==="sim"?"sim":"nao")+"'>"+(l.marcoualula==="sim"?"Sim":"Não")+"</span></td><td><span class='badge badge-"+(l.fezaula==="sim"?"sim":"nao")+"'>"+(l.fezaula==="sim"?"Sim":"—")+"</span></td><td style='cursor:pointer;background:var(--b2);border-radius:var(--rs);padding:6px 8px;font-size:10px;color:var(--mt)' onclick='abrirAnotacoesLead("+idx+")'>"+anotLabel+"</td><td><span class='badge "+status.classe+"'>"+status.texto+"</span></td><td style='display:flex;gap:4px'><button class='btn bd bsm' style='background:none;border:none;cursor:pointer;font-size:14px;padding:2px;color:var(--am);transition:all 0.15s' title='Alterar data' onclick='abrirModalAlterarData("+idx+")'><i class='ti ti-calendar'></i></button><button class='btn bd bsm' style='background:none;border:none;cursor:pointer;font-size:14px;padding:2px;color:#4CAF50;transition:all 0.15s' title='Marcar como concluído' onclick='abrirModalConcluir("+idx+")'><i class='ti ti-check'></i></button><button class='btn bd bsm' style='background:none;border:none;cursor:pointer;font-size:14px;padding:2px;color:#D32F2F;transition:all 0.15s' title='Deletar' onclick='confirmarDeleteLead("+idx+")'><i class='ti ti-trash'></i></button></td></tr>";
  }).join("");
  var finalizadosHtml=finalizados.map(function(l){
    return "<div style='padding:8px;background:var(--b1);border-radius:var(--rs);margin-bottom:6px;font-size:10px;display:flex;justify-content:space-between;align-items:center;opacity:0.7;border:0.5px solid var(--br)'><div><strong style='color:var(--mt)'>"+l.crianca+" — "+l.responsavel+"</strong><div style='font-size:9px;color:var(--mt);margin-top:2px'>"+l.motivo+"</div></div></div>";
  }).join("");
  return "<div class='card'><p class='ct'><i class='ti ti-inbox'></i> Novo Lead</p>"
    +"<div id='ma2'></div>"
    +"<div class='fr'><div class='fi' style='grid-column:1/-1'><label>Nome da criança</label><input type='text' id='lcrianca' placeholder='Nome'></div></div>"
    +"<div class='fr3'><div class='fi'><label>Responsável</label><input type='text' id='lresp' placeholder='Mãe/Pai'></div><div class='fi'><label>Telefone</label><input type='text' id='ltel' placeholder='(14) 9999-9999'></div><div class='fi'><label>Data 1º contato</label><input type='date' id='ldata'></div></div>"
    +"<div class='fr3'><div class='fi'><label>Pediu valor?</label><select id='lpediu'><option value='não'>Não</option><option value='sim'>Sim</option></select></div><div class='fi'><label>Marcou aula?</label><select id='lmarcou'><option value='não'>Não</option><option value='sim'>Sim</option></select></div><div class='fi'><label>Fez a aula?</label><select id='lfez'><option value='não'>Não</option><option value='sim'>Sim</option></select></div></div>"
    +"<div class='fi' style='margin-bottom:10px'><label>Próxima ação em</label><input type='date' id='lproxacao'></div>"
    +"<button class='btn bp bf' onclick='saveNovoLead()'><i class='ti ti-check'></i> Registrar lead</button></div>"
    +"<div class='card'><div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:12px'><p class='ct' style='margin:0'><i class='ti ti-inbox'></i> Leads ("+leads.length+")</p><button class='btn bsm' style='background:var(--al);color:var(--am);border-color:var(--al)' onclick='exportarLeadsPDF()'><i class='ti ti-pdf'></i> PDF</button></div>"
    +"<div class='ox'><table><thead><tr><th>Criança</th><th>Responsável</th><th>Telefone</th><th>Pediu?</th><th>Marcou?</th><th>Fez?</th><th>Anotações</th><th>Próx. ação</th><th>Ações</th></tr></thead><tbody>"+rowsHtml+"</tbody></table></div></div>"
    +(finalizados.length>0?"<div class='card' style='background:var(--b2);border-left:4px solid #4CAF50'><p class='ct' style='color:#2E7D32;margin:0'><i class='ti ti-check'></i> Leads Finalizados ("+finalizados.length+")</p><div style='margin-top:10px'>"+finalizadosHtml+"</div></div>":"");
}

  document.getElementById("lcrianca").value="";document.getElementById("lresp").value="";document.getElementById("ltel").value="";document.getElementById("ldata").value="";document.getElementById("lpediu").value="não";document.getElementById("lmarcou").value="não";document.getElementById("lfez").value="não";document.getElementById("lproxacao").value="";

function salvarConclusao(idx){
  if(!D.leads||!D.leads[idx])return;

  D.leads[idx].status="finalizado";
  D.leads[idx].motivo=motivo;
  saveLeads();
  closeModal();
  refreshContent();
}

function confirmarDeleteLead(idx){
  if(!D.leads||!D.leads[idx])return;
  var crianca=D.leads[idx].crianca||"";
  if(confirm("Deletar \""+crianca+"\" da lista de leads?")){
    D.leads.splice(idx,1);
    saveLeads();
    refreshContent();
  }
}

function formatDateBR(dateStr){
  if(!dateStr||dateStr.trim()==="")return "";
  var parts=dateStr.split("-");
  if(parts.length!==3)return dateStr;
  return parts[2]+"/"+parts[1]+"/"+parts[0];
}

  h+="<table class='table'><thead><tr><th>Criança</th><th>Responsável</th><th>Telefone</th><th>1º Contato</th><th>Pediu?</th><th>Marcou?</th><th>Fez?</th><th>Anotações</th><th>Próx. ação</th></tr></thead><tbody>";
