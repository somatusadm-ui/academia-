<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia — Gestão v6</title>
<!-- ⚡ OTIMIZAÇÃO: Preload de recursos críticos para parallelizar -->
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" as="style">
<link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" as="script">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--brand:#1B5F7A;--brand2:#2E8FB3;--bl:#E8F4F8;--gn:#7CB342;--gl:#E8F5E9;--rd:#D32F2F;--rl:#FFEBEE;--pu:#5E35B1;--pl:#F3E5F5;--am:#FFA726;--al:#FFE0B2;--tl:#00897B;--tll:#B2DFDB;--b1:#fff;--b2:#F9FAFB;--b3:#EEF2F6;--br:#E4EAF0;--tx:#1a1a1a;--mt:#7A8FA3;--r:14px;--rs:9px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#F4F7FA 0%,#EEF2F6 100%);min-height:100vh;font-size:14px;color:var(--tx);-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.sb{width:220px;background:linear-gradient(160deg,#215F7D 0%,#2E8FB3 60%,#3A9DC2 100%);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto;box-shadow:3px 0 18px rgba(15,50,70,.14)}
.sbl{padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.sblt{font-size:15px;font-weight:700;color:#fff;margin-bottom:2px;letter-spacing:-.1px}
.sbls{font-size:11px;color:rgba(255,255,255,.55)}
.sbsc{padding:16px 12px 6px;font-size:10px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:2px 8px;border-radius:10px;cursor:pointer;color:rgba(255,255,255,.72);font-size:13px;font-weight:500;transition:all .18s ease;border:none;background:none;width:calc(100% - 16px);text-align:left}
.ni:hover{background:rgba(255,255,255,.10);color:#fff;transform:translateX(1px)}
.ni.active{background:rgba(255,255,255,.18);color:#fff;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.ni i{font-size:16px;width:18px}
.nd{width:6px;height:6px;border-radius:50%;background:#FCA5A5;margin-left:auto;box-shadow:0 0 0 3px rgba(239,68,68,.18)}
.sbb{margin-top:auto;padding:14px 12px;border-top:1px solid rgba(255,255,255,.12)}
.uc{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.10)}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.avb{background:#3B82F6;color:#fff}.avp{background:#8B5CF6;color:#fff}
.un{font-size:12px;font-weight:700;color:#fff}.ur{font-size:10px;color:rgba(255,255,255,.55)}
.blo{background:none;border:none;color:rgba(255,255,255,.45);cursor:pointer;padding:4px;font-size:16px;margin-left:auto;transition:color .15s}
.blo:hover{color:#fff}
.main{flex:1;margin-left:220px;display:flex;flex-direction:column}
.topbar{background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--br);padding:16px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(20,50,70,.04)}
.tbt{font-size:17px;font-weight:700;letter-spacing:-.2px}.tbs{font-size:12px;color:var(--mt);margin-top:2px}
.content{padding:26px;flex:1}
.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.painel-2col{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.painel-2col{grid-template-columns:1fr}}
.venc15-item{padding:10px;margin-bottom:8px;border-radius:6px;border-left:3px solid;cursor:pointer;transition:all .15s ease}
.venc15-item:hover{filter:brightness(0.97);transform:translateX(2px)}
.painel-hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);border-radius:16px;padding:24px 28px;color:#fff;margin-bottom:20px;box-shadow:0 12px 28px rgba(27,95,122,.22);position:relative;overflow:hidden}
.painel-hero:before{content:'';position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.painel-hero:after{content:'';position:absolute;right:60px;bottom:-70px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.05)}
.painel-hero-row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:18px;position:relative;z-index:1}
.painel-hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:8px}
.painel-hero-title{font-size:23px;font-weight:800;margin-bottom:5px;letter-spacing:-.2px}
.painel-hero-sub{font-size:13px;opacity:.88}
.painel-hero-stats{display:flex;gap:12px;flex-wrap:wrap}
.painel-hero-stat{background:rgba(255,255,255,.14);backdrop-filter:blur(2px);border-radius:12px;padding:12px 18px;text-align:right;min-width:130px}
.painel-hero-stat-label{font-size:10px;opacity:.85;margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.painel-hero-stat-value{font-size:20px;font-weight:800}
.painel-section-label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mt);margin:2px 0 10px 2px;display:flex;align-items:center;gap:8px}
.painel-section-label:before{content:'';width:3px;height:12px;background:var(--brand2);border-radius:2px}
.mes-card{border-radius:14px;transition:all .2s ease}
.mes-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.painel-card-pro{border:1px solid var(--br);border-radius:16px;box-shadow:0 4px 14px rgba(20,50,70,.05)}
.sidebar-badge{background:rgba(255,255,255,.25);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-left:auto}
.sidebar-head{background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;border-radius:14px 14px 0 0;padding:14px 18px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.sidebar-body{border:1px solid var(--br);border-top:none;border-radius:0 0 14px 14px;padding:14px 16px;background:var(--b1)}
.img-widget{margin-bottom:16px}
.img-widget-head{background:linear-gradient(135deg,#D32F2F 0%,#FF7A3D 100%);color:#fff;border-radius:14px 14px 0 0;padding:12px 16px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(211,47,47,.18)}
.img-widget-body{border:1px solid var(--br);border-top:none;border-radius:0 0 14px 14px;padding:14px 16px;background:var(--b1)}
.img-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;font-size:11.5px;font-weight:700;background:#FFF3E0;color:#A32D2D;border:1px solid #FFD8A8}
.profile-header{background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);border-radius:14px;padding:18px 20px;color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.profile-header.is-canc{background:linear-gradient(135deg,#8a8f98 0%,#a7adb8 100%)}
.profile-header:before{content:'';position:absolute;right:-30px;top:-45px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08)}
.profile-header:after{content:'';position:absolute;right:40px;bottom:-55px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.06)}
.profile-avatar-lg{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;flex-shrink:0;position:relative;z-index:1;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.profile-header-name{font-size:17px;font-weight:800;margin:0;letter-spacing:-.2px;position:relative;z-index:1}
.profile-badge{background:rgba(255,255,255,.22)!important;color:#fff!important;border:1px solid rgba(255,255,255,.32)}
.mini-stat{background:var(--b1);border:1px solid var(--br);border-radius:10px;padding:10px 12px;box-shadow:0 2px 6px rgba(20,50,70,.04)}
.mini-stat-label{font-size:10px;color:var(--mt);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.mini-stat-value{font-size:13px;font-weight:800;color:var(--tx)}
.month-status-card{border-radius:14px;padding:16px 18px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid var(--br)}
.month-status-label{font-size:11px;font-weight:700;color:var(--mt);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.timeline-item{border-left:3px solid var(--br);padding:4px 0 12px 14px;margin-left:4px;position:relative}
.timeline-item:before{content:'';position:absolute;left:-6px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--brand2)}
.timeline-item.tl-red{border-left-color:#FFCDD2}.timeline-item.tl-red:before{background:var(--rd)}
.timeline-item.tl-blue{border-left-color:#B2DFDB}.timeline-item.tl-blue:before{background:var(--tl)}
.timeline-item.tl-teal{border-left-color:var(--tll)}.timeline-item.tl-teal:before{background:var(--brand2)}
.timeline-item:last-child{border-left-color:transparent}
.kpi{background:var(--b1);border:1px solid var(--br);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;box-shadow:0 3px 10px rgba(20,50,70,.05);transition:all .25s ease}
.kpi:hover{box-shadow:0 8px 22px rgba(20,50,70,.09);transform:translateY(-2px)}
.ka{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px}
.kl{font-size:11px;color:var(--mt);margin-bottom:6px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.kv{font-size:21px;font-weight:800;line-height:1;letter-spacing:-.2px}.ks{font-size:11px;color:var(--mt);margin-top:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.card{background:var(--b1);border:1px solid var(--br);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;box-shadow:0 3px 12px rgba(20,50,70,.05);transition:box-shadow .25s ease,transform .25s ease}
.c0{margin-bottom:0}
.ct{font-size:14px;font-weight:700;display:flex;align-items:center;gap:9px;margin-bottom:15px;letter-spacing:-.1px}
.ct i{font-size:16px;color:#fff;background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.fr4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.fi{display:flex;flex-direction:column}
.fi label{font-size:11px;font-weight:700;color:var(--mt);margin-bottom:5px;letter-spacing:.03em;text-transform:uppercase}
.fi input,.fi select,.fi textarea{width:100%;font-size:13px;padding:10px 12px;border:1px solid var(--br);border-radius:9px;background:var(--b2);color:var(--tx);outline:none;transition:all .2s ease}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:var(--brand2);background:#fff;box-shadow:0 0 0 3px rgba(46,143,179,.12)}
.fi input[readonly]{background:var(--b2)}
.btn{padding:9px 16px;border-radius:var(--rs);font-size:13px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--br);background:var(--b2);color:var(--tx);transition:all .15s}
.btn:hover{background:var(--b3);transform:translateY(-1px)}
.bp{background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(27,95,122,.25)}.bp:hover{filter:brightness(1.06);transform:translateY(-1px)}
.bs{background:var(--gl);color:var(--gn);border-color:var(--gl)}
.bd{background:var(--rl);color:var(--rd);border-color:var(--rl);padding:5px 10px;font-size:12px}
.bsm{padding:6px 10px;font-size:12px}.bf{width:100%;justify-content:center;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:10px 12px;background:var(--b2);border-bottom:1px solid var(--br);color:var(--mt);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--br);color:var(--tx);vertical-align:middle}
tr:last-child td{border-bottom:none}tr:hover td{background:var(--b2)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;gap:4px}
.bg{background:var(--gl);color:var(--gn)}.br2{background:var(--rl);color:var(--rd)}.bb{background:var(--bl);color:var(--brand)}.bpu{background:var(--pl);color:var(--pu)}.bam{background:var(--al);color:var(--am)}.btl{background:var(--tll);color:var(--tl)}
.empty{text-align:center;padding:2.5rem;color:var(--mt);font-size:13px}
.dv{height:1px;background:var(--br);margin:14px 0}
.pw{background:var(--b2);border-radius:20px;height:8px;overflow:hidden;margin-top:4px}
.pb{height:100%;border-radius:20px}
.sr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--br);font-size:13px}
.sr:last-child{border-bottom:none}.sl{color:var(--mt)}.sv{font-weight:700}
.al2{padding:10px 14px;border-radius:var(--rs);font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.als{background:var(--gl);color:var(--gn)}.ali{background:var(--bl);color:var(--brand)}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--b2);padding:4px;border-radius:var(--rs);width:fit-content;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:none;background:none;color:var(--mt);transition:all .15s}
.tab.active{background:var(--b1);color:var(--tx);box-shadow:0 2px 6px rgba(20,50,70,.08)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.acard{background:var(--b2);border:1px solid var(--br);border-radius:var(--rs);padding:10px 12px;text-align:center;cursor:pointer;transition:all .15s;user-select:none}
.acard:hover{border-color:var(--brand2)}
.acard.presente{background:var(--gl);border-color:var(--gn)}
.acard.falta{background:var(--rl);border-color:var(--rd)}
.acard.reagendado{background:var(--al);border-color:var(--am)}
.an{font-size:11px;font-weight:600;margin-bottom:3px;line-height:1.3}.as{font-size:10px;color:var(--mt)}
.mbadge{background:var(--bl);color:var(--brand);font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;display:flex;align-items:center;gap:5px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.lpage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1B3A5C,#2E6DA4);background-image:url('clinic-bg.jpg');background-size:cover;background-position:center;background-attachment:fixed;background-blend-mode:overlay}
.lpage::before{content:'';position:absolute;inset:0;background:rgba(27,58,92,0.75);z-index:0}
.lcard{position:relative;z-index:1}
.lcard{background:#fff;border-radius:18px;padding:2.6rem;width:380px;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.lbrand{font-size:25px;font-weight:800;color:var(--brand);margin-bottom:4px;letter-spacing:-.3px}
.lsub{font-size:13px;color:var(--mt);margin-bottom:28px}
.lov{position:fixed;inset:0;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;z-index:999;font-size:14px;color:var(--brand);gap:10px;font-weight:600}
.spin{width:20px;height:20px;border:2px solid var(--bl);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes piscar{0%,100%{opacity:1}50%{opacity:.4}}
.alerta-contrato{animation:piscar 1.5s infinite}
.ox{overflow-x:auto}
.modal-overlay{position:fixed;inset:0;background:rgba(15,30,45,.5);backdrop-filter:blur(2px);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:18px;padding:26px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.16)}
.modal-lg{width:700px}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.ci{display:grid;grid-template-columns:90px 1fr 70px 90px 90px 100px 135px;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--br);font-size:12px}
.ci:hover{background:var(--b2)}
.ci-h{font-weight:700;color:var(--mt);font-size:11px;text-transform:uppercase;background:var(--b2)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE}
.agenda-grid{display:grid;border:1px solid var(--br);border-radius:var(--rs);overflow:hidden;background:var(--b1)}
.agenda-header{background:var(--brand);color:#fff;padding:12px;font-size:16px;font-weight:600;text-align:center;border-right:1px solid rgba(255,255,255,.15)}
.agenda-time{background:var(--b2);padding:10px 12px;font-size:15px;color:var(--mt);border-right:1px solid var(--br);border-bottom:1px solid var(--br);text-align:right;font-weight:600;white-space:nowrap;min-width:70px}
.agenda-cell{border-right:1px solid var(--br);border-bottom:1px solid var(--br);padding:8px;min-height:90px;position:relative;cursor:pointer}
.agenda-cell:hover{background:var(--bl)}
.agenda-event{border-radius:4px;padding:6px 10px;font-size:14px;font-weight:600;margin:4px 0;cursor:pointer;line-height:1.5;overflow:visible;white-space:normal;text-overflow:ellipsis}
.ev-amanda{background:#DBEAFE;color:#1D4ED8;border-left:3px solid #2563EB}
.ev-nathalia{background:#EDE9FE;color:#6D28D9;border-left:3px solid #7C3AED}
.cont-row{display:grid;grid-template-columns:1fr 80px 80px 90px 100px 160px;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--br);font-size:12px}
.cont-row:hover{background:var(--b2)}
.cont-h{font-weight:600;color:var(--mt);font-size:11px;text-transform:uppercase;background:var(--b2)}
/* ===== POLIMENTO VISUAL (auditoria 20/07 — apenas aditivo) ===== */
::selection{background:rgba(46,143,179,.22)}
*{scrollbar-width:thin;scrollbar-color:#B9C6D2 transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C3CFDA;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#9FB0BF;border:2px solid transparent;background-clip:content-box}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px;border-radius:4px}
.btn:active{transform:translateY(0) scale(.98)}
.ni:active{transform:translateX(0) scale(.98)}
.kv,.mini-stat-value,.painel-hero-stat-value,.kpi-value{font-variant-numeric:tabular-nums}
td,.sv{font-variant-numeric:tabular-nums}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.lcard{animation:cardIn .35s ease}
.lcard input:focus,.lcard select:focus{border-color:var(--brand2)!important;box-shadow:0 0 0 3px rgba(46,143,179,.14)}
input:disabled,select:disabled,textarea:disabled{opacity:.6;cursor:not-allowed}
.badge,.chip,.mbadge{white-space:nowrap}
.empty i{display:block;font-size:26px;margin-bottom:8px;opacity:.5}
/* Responsivo: telas médias — sidebar só com ícones */
@media(max-width:900px){
  .sb{width:64px}
  .main{margin-left:64px}
  .ni{font-size:0;justify-content:center;gap:0;padding:12px 8px}
  .ni i{font-size:19px;width:auto}
  .nd{position:absolute;margin-left:22px;margin-top:-14px}
  .ni{position:relative}
  .sblt{font-size:0}.sblt i{font-size:20px}
  .sbls,.sbsc{display:none}
  .sbl{padding:18px 0;text-align:center}
  .un,.ur{display:none}
  .uc{justify-content:center;padding:9px 4px}
  .blo{margin-left:0}
  .sbb{padding:10px 6px}
  .kg,.g4{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr}
  .content{padding:16px}
  .topbar{padding:12px 16px}
  .fr4{grid-template-columns:1fr 1fr}
}
/* Responsivo: celular */
@media(max-width:560px){
  .kg,.g2,.g3,.g4,.fr,.fr3,.fr4{grid-template-columns:1fr}
  .painel-hero{padding:18px 16px}
  .painel-hero-stats{width:100%}
  .painel-hero-stat{flex:1;text-align:left;min-width:0}
  .card{padding:14px 14px}
  .tabs{width:100%}
}
/* Impressão da tela principal: esconde navegação */
@media print{
  .sb,.topbar,.btn,.tabs{display:none!important}
  .main{margin-left:0}
  body{background:#fff}
  .card,.kpi{box-shadow:none;break-inside:avoid}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Seção recolhível (ex.: "Já decidiram" em Experimentais) */
details>summary{outline:none}
details>summary::-webkit-details-marker{display:none}
details>summary::marker{content:''}
details>summary:after{content:'\25be';float:right;color:var(--mt);font-size:14px;transition:transform .2s ease}
details[open]>summary:after{transform:rotate(180deg)}
details>summary:hover{color:var(--brand)}
</style>

// Retorna, para cada aluno, o evento mais antigo registrado no histórico (por data).
// Isso representa a matrícula ORIGINAL de verdade, mesmo que o campo dataMatricula
// do cadastro já tenha sido sobrescrito por uma renovação posterior.
function _primeiroEventoPorAluno(){
  var primeiro={};
  (D.historico||[]).forEach(function(h){
    if(!h.dataEvento)return;
    if(!primeiro[h.nome]||h.dataEvento<primeiro[h.nome].dataEvento)primeiro[h.nome]=h;
  });

function ativosNoMes(pfxAnoMes){
  // pfxAnoMes = "YYYY-MM"
  // Importante: NÃO usa ativos() (que reflete só o estado ATUAL). Aqui reconstruímos quem estava
  // realmente matriculado naquele mês específico, considerando a data de cancelamento (se houver).
  // Assim, um aluno cancelado em julho continua aparecendo como matriculado nos relatórios de junho,
  // e um aluno que renovou continua contando desde a matrícula ORIGINAL (não a data da renovação).
  var partes=pfxAnoMes.split("-"),ano=+partes[0],mes=+partes[1];
  var ultimoDia=new Date(ano,mes,0); // ultimo dia do mes
  var primeiros=_primeiroEventoPorAluno();
  return todosObj().filter(function(a){
    var dataOriginal=(primeiros[a.nome]&&primeiros[a.nome].dataEvento)||a.dataMatricula;
    if(dataOriginal){
      if(new Date(dataOriginal+"T00:00:00")>ultimoDia)return false; // matriculou depois desse mês
    }
    var cancInfo=(D.canc||[]).find(function(c){return c.nome===a.nome&&(c.ativo===true||String(c.ativo).toLowerCase()==="true");});
    if(cancInfo&&cancInfo.data){
      var dataCanc=new Date(cancInfo.data+"T00:00:00");
      if(dataCanc<=ultimoDia)return false; // já tinha cancelado até o fim desse mês
    }
    return true;
  });
}

function _movimentacoesMes(anoMes){

  // Isso evita que uma renovação seja contabilizada como matrícula nova (ex: quando o histórico
  // precisou ser reconstruído e criou um registro de apoio).
  var novasLista=(D.historico||[]).filter(function(h){
    return h.evento==="matricula"&&h.dataEvento&&h.dataEvento.startsWith(pfx)&&primeiros[h.nome]===h;
  });
  var renovadasLista=(D.historico||[]).filter(function(h){return h.evento==="renovacao"&&h.dataEvento&&h.dataEvento.startsWith(pfx);});

  // histórico/matrícula quando disponíveis, para trazer plano e valor no relatório.
  var canceladasCanc=(D.canc||[]).filter(function(c){return c.data&&c.data.startsWith(pfx)&&(c.ativo===true||String(c.ativo).toLowerCase()==="true");});

  });

// ===== DEBOUNCE =====
var _dbt={};
// ⚡ OTIMIZAÇÃO: Debounce com throttle para evitar múltiplos saves
var _dbt_last={};
function dbSave(key,fn){
  if(_dbt[key])clearTimeout(_dbt[key]);
  _dbt_fn[key]=fn; // guarda a fn p/ flush imediato se a página fechar
  // Se foi salvo há menos de 3s, estende o timeout a 2s
  var now=Date.now();
  var lastSave=_dbt_last[key]||0;
  var delay=(now-lastSave<3000)?2500:1800;
  _dbt[key]=setTimeout(function(){
    delete _dbt[key];
    delete _dbt_fn[key];
    _dbt_last[key]=Date.now();
    fn();
  },delay);
}
// Se a página for fechada com salvamentos pendentes: dispara na hora e avisa
window.addEventListener("beforeunload",function(e){
  var ks=Object.keys(_dbt);
  if(!ks.length)return;
  _flushing=true;
  ks.forEach(function(k){
    clearTimeout(_dbt[k]);
    var f=_dbt_fn[k];delete _dbt[k];delete _dbt_fn[k];
    if(f){try{f();}catch(_e){}}
  });
  _flushing=false;
  e.preventDefault();
  e.returnValue="Há lançamentos sendo salvos. Aguarde alguns segundos antes de fechar.";
  return e.returnValue;
});

function _respFalhou(resp,txt){
  // Falha se HTTP não-ok OU se o backend novo responder {ok:false}
  if(!resp.ok)return true;
  try{var j=JSON.parse(txt);if(j&&j.ok===false)return true;}catch(_e){}
  return false; // backend antigo (sem JSON {ok}) continua aceito
}
async function push(aba,headers,row){
  // reqId é gerado UMA vez: se a resposta se perder e houver retry, o backend
  // reconhece o mesmo reqId e NÃO grava de novo (fim das duplicatas por retry)
  var body=JSON.stringify({aba:aba,headers:headers,row:row,token:STOKEN,reqId:_novoId("r")});
  var kal=_flushing&&body.length<60000;
  for(var t=1;t<=3;t++){
    try{
      var resp=await fetch(SURL,{
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        keepalive:kal,
        body:body
      });
      var txt=await resp.text();
      if(_respFalhou(resp,txt))throw new Error("HTTP "+resp.status);
      syncOk=true;
      return true;
    }catch(e){
      console.error("push erro (tentativa "+t+"):",aba,e);
      if(t<3)await new Promise(function(r){setTimeout(r,1200*t);});
    }
  }
  syncOk=false;
  try{alert("ATENÇÃO: falha ao gravar em \""+aba+"\". O registro pode NÃO ter sido salvo. Verifique a internet e tente novamente.");}catch(_e){}
  return false;
}
async function rewriteAba(aba, headers, rows){
  if(syncing){ console.warn("rewriteAba bloqueado durante sync:", aba); return false; }
  // TRAVA 1: nunca reescrever uma aba que não carregou com sucesso nesta sessão
  if(_abaOk[aba]!==true){
    alert("BLOQUEADO: a aba \""+aba+"\" não foi carregada corretamente nesta sessão.\nPara proteger os dados já salvos, o salvamento desta aba está travado.\nClique no botão de recarregar (\u21bb) e tente de novo.");
    console.error("rewriteAba BLOQUEADO (aba não carregada):",aba);
    return false;
  }
  // TRAVA 2: anti-apagamento — reescrita vazia ou com queda brusca exige confirmação
  var conhecido=_lastCount[aba]||0;
  var force=false; // enviado ao backend quando a redução foi confirmada pela usuária
  if(rows.length===0&&conhecido>0){
    if(!confirm("ATENÇÃO: você está prestes a APAGAR TODOS os "+conhecido+" registros da aba \""+aba+"\" no Google Sheets.\nTem certeza?"))return false;
    force=true;
  }else if(conhecido>=10&&rows.length<conhecido*0.5){
    if(!confirm("ATENÇÃO: a aba \""+aba+"\" tinha "+conhecido+" registros e será reescrita com apenas "+rows.length+".\nIsso pode indicar perda de dados. Continuar mesmo assim?"))return false;
    force=true;
  }
  var body=JSON.stringify({aba:aba, headers:headers, rows:rows, rewrite:true, token:STOKEN, force:force});
  var kal=_flushing&&body.length<60000;
  for(var t=1;t<=3;t++){
    try{
      var resp=await fetch(SURL,{
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        keepalive:kal,
        body:body
      });
      var txt=await resp.text();
      if(_respFalhou(resp,txt))throw new Error("HTTP "+resp.status);
      // Conferência: o backend novo informa quantas linhas gravou; tem que bater
      try{var jj=JSON.parse(txt);if(jj&&typeof jj.gravadas==="number"&&jj.gravadas!==rows.length)throw new Error("contagem divergente: enviadas "+rows.length+", gravadas "+jj.gravadas);}catch(ce){if(String(ce).indexOf("contagem divergente")>=0)throw ce;}
      syncOk=true;
      _lastCount[aba]=rows.length;
      console.log("SALVO:", aba, rows.length);
      _backupLocal();
      return true;
    }catch(e){
      console.error("rewriteAba erro (tentativa "+t+"):",aba,e);
      if(t<3)await new Promise(function(r){setTimeout(r,1200*t);});
    }
  }
  syncOk=false;
  try{alert("ERRO: não foi possível salvar a aba \""+aba+"\" após 3 tentativas.\nOs dados NÃO foram gravados no Google Sheets. Verifique a internet e tente salvar novamente.\n(Um backup local foi mantido neste navegador.)");}catch(_e){}
  _backupLocal();
  return false;
}
// ===== BACKUP LOCAL (localStorage) =====
// Auditoria 20/07: além do backup principal (ge2_backup_v1), mantém um HISTÓRICO
// rotativo de até 6 snapshots (mín. 10 min de intervalo), para recuperar um estado
// anterior caso o backup mais recente já contenha um erro (ex.: exclusão indevida).
function _backupLocal(){
  var snap;
  try{snap=JSON.stringify({t:Date.now(),D:D});}
  catch(e){console.warn("backup local falhou (serialização):",e);return;}
  try{localStorage.setItem("ge2_backup_v1",snap);}
  catch(e){console.warn("backup local falhou:",e);}
  // Histórico rotativo (só se o snapshot não for grande demais p/ a cota do navegador)
  try{
    if(snap.length>1500000)return; // ~1.5MB por snapshot: acima disso, mantém só o principal
    var hist=[];
    try{hist=JSON.parse(localStorage.getItem("ge2_backup_hist")||"[]");}catch(_e){hist=[];}
    if(!Array.isArray(hist))hist=[];
    var agora=Date.now();
    var ultimo=hist.length?hist[hist.length-1].t:0;
    if(agora-ultimo<10*60*1000)return; // espaça snapshots em 10 min
    hist.push({t:agora,D:D});
    while(hist.length>6)hist.shift();
    localStorage.setItem("ge2_backup_hist",JSON.stringify(hist));
  }catch(e){
    // Cota estourada: descarta o histórico para garantir o backup principal
    try{localStorage.removeItem("ge2_backup_hist");}catch(_e){}
    console.warn("histórico de backup local indisponível:",e);
  }
}

      if(Array.isArray(hist)){

}

// ===== HELPERS DE DATA/HORA (fuso local, sem UTC) =====
// Formata Date -> "YYYY-MM-DD" no fuso LOCAL (toISOString usa UTC e vira o dia errado apos as 21h no Brasil)
function fdISO(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
// Cor da aula na agenda, por professora. Lilian tem cor própria (diferente de Amanda),
// tanto para aulas fixas quanto para experimentais dela. Amanda/Nathalia mantêm a regra
// antiga: experimental sempre verde, fixo por professora.
function corProf(prof,tipo){
  if(prof==="Lilian")return tipo==="experimental"?"#D4A017":"#9C7FD1";
  if(tipo==="experimental")return "#7CB342";
  return prof==="Amanda"?"#2E8FB3":"#5E35B1";
}
// Data limite (60 dias após a aula experimental) para decidir matrícula/não fechamento.
function calcPrazoExp(dataBase){
  if(!dataBase)return "";
  var p=String(dataBase).substring(0,10).split("-");
  if(p.length<3)return "";
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  d.setDate(d.getDate()+60);
  return fdISO(d);
}
// Parse "YYYY-MM-DD" (ou dd/mm/yyyy) -> Date a meia-noite LOCAL (new Date("YYYY-MM-DD") interpreta como UTC e volta 1 dia)
function pdl(s){
  if(s instanceof Date)return s;
  var t=String(s||"").trim();
  var m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=t.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(m)return new Date(+m[3],+m[2]-1,+m[1]);
  return new Date(t);
}
// Extrai "HH:MM" de um valor de hora serializado pelo Sheets (data 1899-12-30 no fuso do script)
function horaDoSheets(vs){
  var _dh=new Date(vs);
  if(isNaN(_dh.getTime()))return vs.substring(11,16);
  var _hm;
  try{
    _hm=_dh.toLocaleTimeString("pt-BR",{timeZone:"America/Sao_Paulo",hour:"2-digit",minute:"2-digit",hour12:false});
  }catch(e){
    var _h2=(_dh.getUTCHours()+21)%24;_hm=String(_h2).padStart(2,"0")+":"+String(_dh.getUTCMinutes()).padStart(2,"0");
  }
  var _p=_hm.split(":"),_tot=(+_p[0])*60+(+_p[1]);
  _tot=Math.round(_tot/15)*15;_tot=((_tot%1440)+1440)%1440;
  return String(Math.floor(_tot/60)).padStart(2,"0")+":"+String(_tot%60).padStart(2,"0");
}
async function loadAba(aba){
  try{
    var r=await fetch(SURL+"?aba="+encodeURIComponent(aba)+"&token="+encodeURIComponent(STOKEN),{mode:"cors",headers:{"Accept":"application/json"}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    var rows=await r.json();
    if(!Array.isArray(rows)||rows.length<2)return[];
    var h=rows[0];
    return rows.slice(1).map(function(row){
      var obj={};
      h.forEach(function(k,i){
        var v=row[i];
        var vs=String(v||"").trim();
        var vl=vs.toLowerCase();
        if(vl==="true")obj[k]=true;
        else if(vl==="false")obj[k]=false;
        // Limpar datas ISO (ex: 2026-01-19T03:00:00.000Z → 2026-01-19)
        else if(/^\d{4}-\d{2}-\d{2}T/.test(vs)){
          if(k==="hora"||k==="horario"){
            // Campo de horario vindo do Sheets como data/hora (ex: 1899-12-30T20:06:28.000Z).
            // Converte para o fuso de Sao Paulo (Intl trata offsets historicos de 1899) e arredonda p/ 15min p/ eliminar residuos
            obj[k]=horaDoSheets(vs);
          }else{
            obj[k]=vs.substring(0,10);
          }
        }
        else if(k==="numero"||k==="telefone")obj[k]=vs; // telefone fica como texto (não perde zero/formato)
        else if(v!==""&&v!==null&&v!==undefined&&vs!==""&&!isNaN(v))obj[k]=+v;
        else obj[k]=v||"";
      });
      return obj;
    });
  }catch(e){console.error("loadAba error:",aba,e);return null;}
}

function dataVencMes(diaVenc,ano,mes){
  // Constrói YYYY-MM-DD para o dia escolhido pelo aluno no mês/ano dados

  var ultimoDia=new Date(ano,mes,0).getDate();
  var dia=Math.min(+diaVenc,ultimoDia);
  return ano+"-"+String(mes).padStart(2,"0")+"-"+String(dia).padStart(2,"0");
}

  ativos().forEach(function(a){

    if(a.dataMatricula){var dm=new Date(a.dataMatricula+"T00:00:00");if(dm>ultimoDiaMes)return;}
    var dv=dataVencMes(a.diaVenc,ano,mes);
    var pgList=D.pag.filter(function(p){return p.aluno===a.nome&&p.data&&p.data.startsWith(pfxMes);});
    var pago=pgList.length>0;
    var inf=pago?pgList[0]:null;
    lista.push({nome:a.nome,valor:a.valor,plano:a.plano,dataVenc:dv,pago:pago,dataPag:inf?inf.data:"",numDoc:"",formaPag:inf?inf.forma:"",diasSem:a.diasSem||""});
  });
  return lista;
}

function ensureCaixaMes(){
  var ano=MES_ANO.a,mes=MES_ANO.m,pfx=mesAtualPfx();
  // Remover do caixa qualquer entrada de aluno cancelado
  D.caixa=D.caixa.filter(function(c){return!eCanc(c.nome);});
  // Remover entradas geradas antes do inicio do contrato
  D.caixa=D.caixa.filter(function(c){
    if(!c.dataVenc)return true;
    var mat=D.mat.find(function(m){return m.nome===c.nome;});
    if(!mat||!mat.dataMatricula)return true;
    var inicioContrato=new Date(mat.dataMatricula+"T00:00:00");
    var mesEntrada=new Date(c.dataVenc.substring(0,7)+"-01T00:00:00");
    return mesEntrada>=new Date(mat.dataMatricula.substring(0,7)+"-01T00:00:00");
  });
  // Remover duplicatas (manter só 1 por nome/mês)
  var vistos=new Set();
  D.caixa=D.caixa.filter(function(c){
    if(!c.dataVenc)return true;
    var chave=c.nome+"|"+c.dataVenc.substring(0,7);
    if(vistos.has(chave))return false;
    vistos.add(chave);
    return true;
  });
  // Adicionar alunos ativos que ainda não têm entrada no mês
  var _ultimoDiaMesAtual=new Date(ano,mes,0);
  ativos().forEach(function(a){
    // Nao criar entrada se contrato nao iniciou ainda neste mes
    if(a.dataMatricula){var _dm=new Date(a.dataMatricula+"T00:00:00");if(_dm>_ultimoDiaMesAtual)return;}
    var jaTem=D.caixa.find(function(c){return c.nome===a.nome&&c.dataVenc&&c.dataVenc.startsWith(pfx);});
    if(!jaTem){
      var dv=dataVencMes(a.diaVenc,ano,mes);
      var pfxMes=pfx;
      var pgList=D.pag.filter(function(p){return p.aluno===a.nome&&p.data&&p.data.startsWith(pfxMes);});
      var pago=pgList.length>0;
      var inf=pago?pgList[0]:null;
      D.caixa.push({nome:a.nome,valor:a.valor,plano:a.plano,dataVenc:dv,pago:pago,dataPag:inf?inf.data:"",numDoc:"",formaPag:inf?inf.forma:"",diasSem:a.diasSem||""});
    }
  });
}

async function syncAll(){
  syncing=true;
  showLov(true);
  var cats=[
  "pag",
  "mat",
  "desp",
  "aulas",
  "exp",
  "caixa",
  "canc",
  "feedbacks",
  "agenda",
  "historico",
  "perfis",
  "leads",
  "pront",
  "msgdia",
  "precos",
  "ponto"
];

var abas=[
  "pagamentos",
  "matriculas",
  "despesas",
  "aulas",
  "experimentais",
  "caixa",
  "cancelados",
  "feedbacks",
  "agenda",
  "historico",
  "perfis",
  "leads",
  "prontuario",
  "mensagemdia",
  "tabelaprecos",
  "ponto"
];
  // ⚡ OTIMIZAÇÃO: Carregar TODAS as abas em paralelo com Promise.all() ao invés de sequencial
  var promises=abas.map(function(aba){return loadAba(aba);});
  var results=await Promise.all(promises.map(function(p){return p.catch(function(){return null;});}));
  _abasFalha=[];
  for(var i=0;i<cats.length;i++){
    // null = erro de rede/backend; [] = aba vazia mas carregada OK
    if(results[i]===null){_abaOk[abas[i]]=false;_abasFalha.push(abas[i]);}
    else{_abaOk[abas[i]]=true;_lastCount[abas[i]]=results[i].length;}
    try{
      var rows=results[i];
      if(rows&&rows.length>0){
        if(abas[i]==="agenda"){
          // Deduplicar agenda: manter só o primeiro por aluno+data+hora
          var vistos={};
          rows=rows.filter(function(r){
            var k=(r.aluno||r.nome||"")+"_"+r.data+"_"+r.hora;
            if(vistos[k])return false;
            vistos[k]=true;
            // Normalizar campo nome→aluno se vier do formato antigo
            if(!r.aluno&&r.nome){r.aluno=r.nome;delete r.nome;}
            return true;
          });
        }
        if(abas[i]==="despesas"){
          // Deduplicar despesas: remove linhas 100% idênticas (mesma descrição, valor, data,
          // forma, tipo e observação) — causadas por reenvio de rede (retry) ou duplo salvamento.
          var vistosDp={};
          rows=rows.filter(function(d){
            var k=(d.descricao||"")+"|"+(d.valor||"")+"|"+(d.data||"")+"|"+(d.forma||"")+"|"+(d.tipo||"")+"|"+(d.obs||"");
            if(vistosDp[k])return false;
            vistosDp[k]=true;
            return true;
          });
        }
        D[cats[i]]=rows;
      }
    }
    catch(e){console.warn("Falha ao processar aba:",abas[i],e);}
  }
  // Migrar, uma única vez, os alunos "fixos" (definidos no código-fonte) para a aba
  // matriculas do Sheets. A partir daí, AF é esvaziado e TODOS os dados passam a vir
  // exclusivamente do Sheets — edições, cancelamentos e exclusões passam a persistir de verdade.
  if(!_afMigrado&&_abaOk["matriculas"]===true&&AF.length>0){
    var precisaMigrar=false;
    AF.forEach(function(a){
      var jaExiste=D.mat.some(function(m){return m.nome===a.nome;});
      if(!jaExiste){
        D.mat.push({nome:a.nome,numero:a.numero||"",data:a.dataMatricula||"",plano:a.plano,valor:a.valor,
          diaVenc:a.diaVenc,diasSem:a.diasSem||"",horario:a.horario||"",prof:a.prof,canal:"",
          desconto:0,promocao:"",dataMatricula:a.dataMatricula||""});
        precisaMigrar=true;
      }
    });
    if(precisaMigrar)await saveMatriculas();
    AF=[];
    _afMigrado=true;
  }
  // Criar registro de 1ª matrícula no histórico para quem ainda não tem
  if(!D.historico)D.historico=[];
  if(!D.pront)D.pront=[];
  var hh=["nome","plano","valor","diaVenc","prof","dataMatricula","dataRenovacao","vencimento","evento","dataEvento"];
  var todosList=todosObj();
  var _precisaSalvarHistBackfill=false;
  for(var i=0;i<todosList.length;i++){
    var a=todosList[i];
    // Nao criar se ja existe QUALQUER registro de matricula/renovacao (evita fabricar "1a matricula" com a data da renovacao)
    var jaTem=D.historico.find(function(h){return h.nome===a.nome&&(h.evento==="matricula"||h.evento==="renovacao");});
    if(!jaTem&&a.dataMatricula){
      var hObj={nome:a.nome,plano:a.plano,valor:a.valor,diaVenc:a.diaVenc,prof:a.prof,
        dataMatricula:a.dataMatricula,dataRenovacao:"",
        vencimento:calcVencContrato(a.dataMatricula,a.plano)||"",
        evento:"matricula",dataEvento:a.dataMatricula};
      D.historico.push(hObj);
      _precisaSalvarHistBackfill=true;
    }
  }
  // IMPORTANTE: persistir imediatamente. Sem isso, esse preenchimento automático ficava só na
  // memória e era refeito a CADA recarregamento — se o aluno já tivesse renovado nesse meio tempo,
  // o "dataMatricula" usado aqui já estaria sobrescrito pela data da renovação, fazendo a renovação
  // ser contabilizada como matrícula nova toda vez que a página recarregasse.
  if(_precisaSalvarHistBackfill&&_abaOk["historico"]===true)await saveHistoricoAll();
  // Dedup: remove pagamentos com o MESMO id (só pode existir 1 de cada)
  var _vistos={};
  D.pag=D.pag.filter(function(p){
    if(!p.id)return true;
    if(_vistos[p.id])return false;
    _vistos[p.id]=true;return true;
  });
  // Só regenerar o caixa do zero se a aba realmente carregou vazia (nunca em falha de rede)
  if(_abaOk["caixa"]===true&&D.caixa.length===0){D.caixa=gerarCaixa();}
  ensureCaixaMes();
  syncing=false;
  syncOk=_abasFalha.length===0;
  showLov(false);
  _backupLocal();
  if(_abasFalha.length){
    alert("ATENÇÃO: as abas ["+_abasFalha.join(", ")+"] NÃO carregaram do Google Sheets.\nPor segurança, o salvamento delas está bloqueado até recarregar com sucesso (botão \u21bb).");
  }
}

function calcDesc(base){
  var sel=document.getElementById("bds").value,wrap=document.getElementById("bdc"),vEl=document.getElementById("bv");
  if(sel==="c"){wrap.style.display="";var cv=parseFloat(document.getElementById("bdcv").value)||0;vEl.value=(base-cv).toFixed(2);}
  else{wrap.style.display="none";vEl.value=(base*(1-sel/100)).toFixed(2);}
  calcLiqB();
}
function calcLiqB(){
  var b=parseFloat(document.getElementById("bv").value)||0,f=document.getElementById("bf").value||"PIX",el=document.getElementById("bl");
  var liq=lq(b,f),taxa=b-liq;
  if(el)el.value=BRL(liq);
  var elTaxa=document.getElementById("tx-taxa"),elLiq=document.getElementById("tx-liquido");
  if(elTaxa)elTaxa.textContent="-"+BRL(taxa);
  if(elLiq)elLiq.textContent=BRL(liq);
}

async function salvarEdicaoPag(idx){

async function excluirTodosPagamentos(){
  if(!confirm("Excluir TODOS os pagamentos?"))return;
  if(!confirm("Confirma? Esta ação não pode ser desfeita."))return;
  D.pag=[];
  // Zerar status pago no caixa
  D.caixa.forEach(function(c){c.pago=false;c.dataPag="";c.numDoc="";c.formaPag="";});
  await _savePagamentosNow();
  await _saveCaixaNow();
  refreshContent();
}
async function excluirPagamento(idx){
  var p=D.pag[idx];
  if(!p)return;
  if(!confirm("Excluir pagamento de "+p.aluno.split(" ")[0]+" ("+BRL(p.bruto)+" em "+fd(p.data)+")?"))return;
  // Reverter status no caixa
  var pfxMes=p.data?p.data.substring(0,7):"";
  var cx=D.caixa.find(function(c){return c.nome===p.aluno&&c.dataVenc&&c.dataVenc.startsWith(pfxMes);});
  if(cx&&isPago(cx)){
    // Checar se há outro pagamento no mesmo mês para este aluno
    var outrosPag=D.pag.filter(function(x,xi){return xi!==idx&&x.aluno===p.aluno&&x.data&&x.data.startsWith(pfxMes);});
    if(outrosPag.length===0){cx.pago=false;cx.dataPag="";cx.numDoc="";cx.formaPag="";}
  }
  D.pag.splice(idx,1);
  // Reescrever aba pagamentos inteira
  await _savePagamentosNow();
  // Salvar caixa atualizado
  await _saveCaixaNow();
  refreshContent();
}
function prefillAluno(){
  var nome=document.getElementById("pal").value,d=getDados(nome);
  var outroInput=document.getElementById("pal_outro");
  if(nome==="Outro"){
    outroInput.style.display="block";
    outroInput.focus();
  }else{
    outroInput.style.display="none";
    outroInput.value="";
    if(d&&d.valor){document.getElementById("pt").value=d.valor;calcBruto();}
  }
}
function calcBruto(){
  var t=parseFloat(document.getElementById("pt").value)||0;
  var dc=parseFloat(document.getElementById("pdc").value)||0;
  var dp=parseFloat(document.getElementById("pdp")?document.getElementById("pdp").value:0)||0;
  var base=t-dc;
  var b=base*(1-dp/100);
  document.getElementById("pb").value=b>0?b.toFixed(2):"";atualizaLiq();
}
function atualizaLiq(){
  var b=parseFloat(document.getElementById("pb").value)||0,f=document.getElementById("pf").value||"PIX",el=document.getElementById("pliq");
  if(el)el.value=lq(b,f).toLocaleString("pt-BR",{minimumFractionDigits:2});
}
function _chavePag(p){return [p.aluno,p.data,p.bruto,p.forma,p.plano].join("|");}
function _contarDuplicatasPag(){
  var mapa={},total=0;
  D.pag.forEach(function(p){var k=_chavePag(p);mapa[k]=(mapa[k]||0)+1;});
  Object.keys(mapa).forEach(function(k){if(mapa[k]>1)total+=mapa[k]-1;});
  return {total:total};
}
async function limparDuplicatasPag(){
  var info=_contarDuplicatasPag();
  if(info.total===0){alert("Nenhuma duplicata encontrada.");return;}
  if(!confirm("Remover "+info.total+" pagamento(s) duplicado(s)?\nDe cada grupo idêntico (mesmo aluno, data, valor, forma e tipo), será mantido apenas 1."))return;
  var vistos={};
  var antes=D.pag.length;
  D.pag=D.pag.filter(function(p){var k=_chavePag(p);if(vistos[k])return false;vistos[k]=true;return true;});
  await _savePagamentosNow();
  refreshContent();
  alert((antes-D.pag.length)+" duplicata(s) removida(s). Restaram "+D.pag.length+" pagamentos.");
}
async function savePag(){
  if(!_umaVez("savePag"))return; // ignora duplo clique
  var btn=document.getElementById("btnSavePag");if(btn){btn.disabled=true;setTimeout(function(){btn.disabled=false;},2500);}
  var alunoSel=document.getElementById("pal").value,data=document.getElementById("pd").value;
  var aluno=alunoSel==="Outro"?document.getElementById("pal_outro").value:alunoSel;
  if(alunoSel==="Outro"&&!aluno){alert2("pa","Digite o nome da criança.",false);return;}
  var bruto=+document.getElementById("pb").value||0,forma=document.getElementById("pf").value;
  if(!data||!bruto){alert2("pa","Preencha data e valor.",false);return;}
  var liquido=lq(bruto,forma);
  var plano=document.getElementById("ppl").value;
  var pfxMes=data.substring(0,7);
  var tabela=+document.getElementById("pt").value||0;
  var desconto=+document.getElementById("pdc").value||0;
  var descPont=+document.getElementById("pdp").value||0;
  var obj={id:_novoId("p"),aluno:aluno,data:data,tabela:tabela,desconto:desconto,descontoPontualidade:descPont,bruto:bruto,liquido:liquido,forma:forma,plano:plano,banco:"SICREDI"};
  D.pag.push(obj);
  var cx=D.caixa.find(function(c){return c.nome===aluno&&c.dataVenc&&c.dataVenc.startsWith(pfxMes)&&!isPago(c);});
  if(cx){cx.pago=true;cx.dataPag=data;cx.formaPag=forma;}
  await savePagamentos();
  await saveCaixa();
  alert2("pa","Pagamento registrado! Caixa atualizado.",true);
  setTimeout(function(){refreshContent();},800);
}

// ===== FEEDBACKS (painel de acompanhamento +60 dias) =====
var FEEDBACK_CICLO_DIAS=60;
function _feedbackInfoAluno(a){
  var fbs=(D.feedbacks||[]).filter(function(f){return f.aluno===a.nome;}).slice().sort(function(x,y){return x.data<y.data?-1:1;});
  var qtd=fbs.length;
  var ultimo=qtd>0?fbs[qtd-1]:null;
  // Regra: se já existe pelo menos 1 feedback, o ciclo de 60 dias conta a partir do ÚLTIMO envio.
  // Se o aluno nunca recebeu feedback (matrícula recente ou antiga sem registro), conta a partir da data da matrícula.
  var baseData=ultimo?ultimo.data:(a.dataMatricula||"");
  var proximo="";
  if(baseData){
    var dp=new Date(baseData+"T00:00:00");
    dp.setDate(dp.getDate()+FEEDBACK_CICLO_DIAS);
    proximo=fdISO(dp);
  }
  var hoje=fdISO(new Date());
  var diasRestantes=proximo?Math.round((new Date(proximo+"T00:00:00")-new Date(hoje+"T00:00:00"))/86400000):null;
  var status;
  if(diasRestantes===null)status="semenvio";
  else if(diasRestantes<0)status=qtd===0?"atrasado":"atrasado";
  else if(diasRestantes<=7)status="embreve";
  else status=qtd===0?"semenvio":"emdia";
  return {aluno:a,fbs:fbs,qtd:qtd,ultimo:ultimo,proximo:proximo,diasRestantes:diasRestantes,status:status};
}

async function cancelarAluno(nome,fixo){
  if(!confirm("Cancelar matrícula de "+nome.split(" ")[0]+"?"))return;

  var ei=D.canc.findIndex(function(c){return c.nome===nome;});
  var obj={nome:nome,fixo:String(fixo),ativo:true,data:hoje};
  if(ei>=0)D.canc[ei]=obj;else D.canc.push(obj);
  var d=getDados(nome);
  if(!D.historico)D.historico=[];
  var hh=["nome","plano","valor","diaVenc","prof","dataMatricula","dataRenovacao","vencimento","evento","dataEvento"];
  var hObj={nome:nome,plano:d?d.plano:"",valor:d?d.valor:0,diaVenc:d?d.diaVenc:"",prof:d?d.prof:"",
    dataMatricula:(d&&d.dataMatricula)||"",dataRenovacao:"",vencimento:"",
    evento:"cancelado",dataEvento:hoje};
  D.historico.push(hObj);
  await saveHistoricoAll(); // persiste o evento de cancelamento no historico (sempre, mesmo sem dados completos do plano)
  D.caixa=D.caixa.filter(function(c){return c.nome!==nome||(c.pago===true||c.pago==="true");});

  await saveCaixa();

async function confirmarRenovacao(nome){
  var d=getDados(nome);if(!d)return;
  var novaData=document.getElementById("rndata").value;
  var novoPlano=document.getElementById("rnpl").value;
  var novoValor=+document.getElementById("rnval").value||d.valor;
  var novoDv=+document.getElementById("rndv").value||d.diaVenc;
  var novoProf=document.getElementById("rnpr").value;
  var novoDesc=+document.getElementById("rndes").value||0;
  var mat=D.mat.find(function(m){return m.nome===nome;});
  var af=AF.find(function(a){return a.nome===nome;});
  var dataMatAtual=(mat?(mat.dataMatricula||mat.data):"")
    ||(d.dataMatricula||"")
    ||(af?af.dataMatricula:"")
    ||"";
  var vencAtual=calcVencContrato(dataMatAtual,d.plano)||"";
  if(!D.historico)D.historico=[];
  // 1) Garantir que o periodo ANTERIOR esteja registrado (se o aluno ainda nao tem historico, cria a 1a matricula com os dados antigos)
  var temHist=D.historico.some(function(h){return h.nome===nome&&(h.evento==="matricula"||h.evento==="renovacao");});
  if(!temHist&&dataMatAtual){
    D.historico.push({nome:nome,plano:d.plano,valor:d.valor,diaVenc:d.diaVenc,prof:d.prof,
      dataMatricula:dataMatAtual,dataRenovacao:"",vencimento:vencAtual,
      evento:"matricula",dataEvento:dataMatAtual});
  }
  // 2) Registrar o NOVO periodo como renovacao (plano/valor/vencimento novos)
  var hObj={nome:nome,plano:novoPlano,valor:novoValor,diaVenc:novoDv,prof:novoProf,
    dataMatricula:novaData,dataRenovacao:novaData,vencimento:calcVencContrato(novaData,novoPlano)||"",
    evento:"renovacao",dataEvento:novaData};
  D.historico.push(hObj);

function calcVencContrato(dataMatricula,plano){
  if(!dataMatricula||String(dataMatricula).trim()===""||plano==="Mensal")return null;
  var dm=String(dataMatricula).trim();
  var d;
  if(/^\d{4}-\d{2}-\d{2}/.test(dm)){
    var p=dm.substring(0,10).split("-");d=new Date(+p[0],+p[1]-1,+p[2]);
  } else if(/^\d{2}\/\d{2}\/\d{4}$/.test(dm)){
    var p=dm.split("/");d=new Date(+p[2],+p[1]-1,+p[0]);
  } else {return null;}
  if(isNaN(d.getTime()))return null;
  // Vencimento por MESES corridos (mesmo dia do mes), nao por dias fixos:
  // Trimestral 11/02 -> 11/05 (antes 90 dias dava 12/05). Se o dia nao existe no mes destino, usa o ultimo dia.
  var meses=plano==="Trimestral"?3:plano==="Semestral"?6:plano==="Anual"?12:0;
  if(!meses)return null;
  var anoV=d.getFullYear(),mesV=d.getMonth()+meses,diaV=d.getDate();
  var ultimo=new Date(anoV,mesV+1,0).getDate();
  var v=new Date(anoV,mesV,Math.min(diaV,ultimo));
  return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");
}
function statusContrato(venc,cancelado){
  if(cancelado)return{label:"Cancelado",cls:"br2"};
  if(!venc)return{label:"Em vigor",cls:"bg"};
  var hoje=fdISO(new Date());
  if(venc<hoje)return{label:"Vencido",cls:"br2"};
  if(venc.slice(0,7)===hoje.slice(0,7))return{label:"Ir\u00e1 vencer",cls:"bam"};
  return{label:"Em vigor",cls:"bg"};
}
async function cancelarContrato(nome){
  var can=eCanc(nome);
  if(!can){if(!confirm("Cancelar contrato de "+nome.split(" ")[0]+"?"))return;}
  if(!D.canc)D.canc=[];
  var ei=D.canc.findIndex(function(c){return c.nome===nome;});
  var novoAtivo=!can;
  var obj={nome:nome,fixo:String(AF.some(function(a){return a.nome===nome;})),ativo:novoAtivo,data:fdISO(new Date())};
  if(ei>=0)D.canc[ei]=obj;else D.canc.push(obj);
  
  // SE CANCELANDO: remover aulas fixas do aluno
  if(!novoAtivo){
    if(D.agenda){
      D.agenda=D.agenda.filter(function(a){
        // Mantém se: não é do aluno OU é avulso (não é fixo)
        return a.aluno!==nome || a.frequencia!=="fixo";
      });
    }
  }
  
  if(novoAtivo){
    D.caixa=D.caixa.filter(function(c){return c.nome!==nome||isPago(c);});
  }
  D.caixa=gerarCaixa();
  ensureCaixaMes();
  await saveCancelados();
  await saveCaixa();
  if(!novoAtivo) await saveAgenda(); // Salvar agenda se removeu aulas
  refreshContent();
}

function getWeekDates(offset){
  var d=new Date(),day=d.getDay(),monday=new Date(d);
  monday.setDate(d.getDate()-(day===0?6:day-1)+offset*7);
  var dates=[];
  for(var i=0;i<7;i++){var dd=new Date(monday);dd.setDate(monday.getDate()+i);dates.push(dd);}
  return dates;
}

// ===== CONTROLE DE ALUNOS EM EXPERIMENTAL (agrupado por aluno — visão geral, não filtra por mês) =====
function _agruparExpPorAluno(){
  var grupos={};
  (D.exp||[]).forEach(function(e){
    if(!e.nome)return;
    if(!grupos[e.nome])grupos[e.nome]=[];
    grupos[e.nome].push(e);
  });
  var lista=Object.keys(grupos).map(function(nome){
    var sessoes=grupos[nome].slice().sort(function(a,b){return (a.data||"")<(b.data||"")?-1:((a.data||"")>(b.data||"")?1:0);});
    var ultima=sessoes[sessoes.length-1];
    var sessaoConvertida=sessoes.find(function(s){return s.convertido===true||s.convertido==="true";});
    var convertido=!!sessaoConvertida;
    var naoConvertido=!convertido&&(ultima.naoConvertido===true||ultima.naoConvertido==="true");
    var status=convertido?"convertido":(naoConvertido?"naoConvertido":"pendente");
    // Ação (Fechou/Alterar data/Não vai fechar) sempre atua na sessão convertida, se houver; senão na mais recente.
    var sessaoAlvo=sessaoConvertida||ultima;
    return {
      nome:nome,
      primeiraData:sessoes[0].data,
      ultimaData:ultima.data,
      qtd:sessoes.length,
      canal:ultima.canal,
      prof:ultima.prof,
      presenca:ultima.presenca||"",
      status:status,
      dataFechamento:sessaoAlvo.dataFechamento||"",
      motivoNaoFechou:sessaoAlvo.motivoNaoFechou||"",
      prazo:calcPrazoExp(sessoes[0].data),
      ultimoIdx:D.exp.indexOf(sessaoAlvo)
    };
  });
  lista.sort(function(a,b){return (b.ultimaData||"")<(a.ultimaData||"")?-1:((b.ultimaData||"")>(a.ultimaData||"")?1:0);});
  return lista;
}

// Pede a data real de fechamento (pode ser em outro mês, diferente do mês da aula experimental)
// e só então marca o aluno como convertido — é essa data que alimenta os painéis.
// Em seguida, leva direto para a tela de Matrículas já preenchida com nome/data/canal/professora,
// pra Catarina só completar plano, valor e horário e confirmar.
var _prefillMatricula=null;
function converterExpComData(i){
  if(!D.exp[i])return;
  var exp=D.exp[i];
  var jaEraConvertido=exp.convertido===true||exp.convertido==="true";
  var def=exp.dataFechamento||fdISO(new Date());
  var r=prompt("Data em que a matrícula foi fechada (AAAA-MM-DD):",def);
  if(r===null)return; // cancelou
  var v=String(r).trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){alert("Data inválida. Use o formato AAAA-MM-DD.");return;}
  convExp(i,true,v);
  if(!jaEraConvertido){
    // Primeira conversão: leva direto para o formulário de matrícula, já preenchido.
    _prefillMatricula={nome:exp.nome,data:v,canal:exp.canal||"",prof:exp.prof||""};
    goTab("matriculas");
    setTimeout(_aplicarPrefillMatricula,0);
  }
}
function _aplicarPrefillMatricula(){
  if(!_prefillMatricula)return;
  var p=_prefillMatricula;
  var elNome=document.getElementById("mn");if(elNome)elNome.value=p.nome;
  var elData=document.getElementById("md");if(elData)elData.value=p.data;
  var elCanal=document.getElementById("mc2");
  if(elCanal&&p.canal){for(var i=0;i<elCanal.options.length;i++){if(elCanal.options[i].text===p.canal){elCanal.selectedIndex=i;break;}}}
  var elProf=document.getElementById("mpr");
  if(elProf&&p.prof){for(var j=0;j<elProf.options.length;j++){if(elProf.options[j].text===p.prof){elProf.selectedIndex=j;break;}}}
  if(elNome){
    elNome.scrollIntoView({behavior:"smooth",block:"center"});
    elNome.style.boxShadow="0 0 0 3px rgba(46,143,179,.35)";
    setTimeout(function(){elNome.style.boxShadow="";},2200);
  }
  _prefillMatricula=null;
}

// conv=true/false. dataFech: data real do fechamento (opcional — usada quando conv=true).

async function convExp(i,conv,dataFech,motivo){
  if(!D.exp[i])return;
  D.exp[i].convertido=conv;D.exp[i].naoConvertido=!conv;
  D.exp[i].dataFechamento=conv?(dataFech||D.exp[i].dataFechamento||fdISO(new Date())):"";

  var h=["nome","data","canal","prof","obs","convertido","naoConvertido","presenca","dataFechamento","motivoNaoFechou"];
  var rows=D.exp.map(function(e){return h.map(function(k){return String(e[k]||"");});});
  dbSave("exp",function(){rewriteAba("experimentais",h,rows);});
  refreshContent();
}

// ===== DESPESAS =====
function setMesDesp(m){mesAtualDesp=m;}
function _chaveDesp(d){return [d.descricao,d.data,d.valor,d.forma,d.tipo].join("|").toLowerCase();}
function _contarDuplicatasDesp(){
  var mapa={},total=0;
  D.desp.forEach(function(d){var k=_chaveDesp(d);mapa[k]=(mapa[k]||0)+1;});
  Object.keys(mapa).forEach(function(k){if(mapa[k]>1)total+=mapa[k]-1;});
  return {total:total};
}
async function limparDuplicatasDesp(){
  var info=_contarDuplicatasDesp();
  if(info.total===0){alert("Nenhuma duplicata encontrada.");return;}
  if(!confirm("Remover "+info.total+" despesa(s) duplicada(s)?\nDe cada grupo idêntico (mesma descrição, data, valor, forma e tipo), será mantido apenas 1."))return;
  var vistos={};
  var antes=D.desp.length;
  D.desp=D.desp.filter(function(d){var k=_chaveDesp(d);if(vistos[k])return false;vistos[k]=true;return true;});
  var h=["descricao","valor","data","forma","tipo","obs"];
  var rows=D.desp.map(function(d){return h.map(function(k){return String(d[k]||"");});});

function despHtml(){
  try{
  if(!mesAtualDesp){var _d=new Date();mesAtualDesp=String(_d.getMonth()+1).padStart(2,"0")+"/"+_d.getFullYear();}
  var _ma=mesAtualDesp.split("/"),_pm=String(+_ma[0]).padStart(2,"0"),_pa=_ma[1];
  var pfxDesp=_pa+"-"+_pm+"-";
  var desp_mes=D.desp.filter(function(d){return d.data&&d.data.startsWith(pfxDesp);}).sort(function(a,b){return (b.data||"").localeCompare(a.data||"");});
  var fx=desp_mes.filter(function(d){return d.tipo==="Fixa";}).reduce(function(a,d){return a+(+d.valor||0);},0);
  var vr=desp_mes.filter(function(d){return d.tipo!=="Fixa";}).reduce(function(a,d){return a+(+d.valor||0);},0);
  var totalMes=fx+vr;
  var pctFx=totalMes>0?Math.round(fx/totalMes*100):0;
  var pctVr=100-pctFx;
  var maiorDesp=desp_mes.length?desp_mes.reduce(function(a,b){return (+b.valor||0)>(+a.valor||0)?b:a;}):null;
  // Comparativo com o mês anterior (para os indicadores de tendência dos KPIs)
  var _pmAnt=+_pm,_paAnt=+_pa;_pmAnt--;if(_pmAnt<1){_pmAnt=12;_paAnt--;}
  var pfxDespAnt=_paAnt+"-"+String(_pmAnt).padStart(2,"0")+"-";

  var vrAnt=desp_mesAnt.filter(function(d){return d.tipo!=="Fixa";}).reduce(function(a,d){return a+(+d.valor||0);},0);
  var totalAnt=fxAnt+vrAnt;
  function _tendDesp(atual,anterior){
    if(!anterior)return "";

    var pct=Math.round(Math.abs(diff)/anterior*100);

    var seta=subiu?"ti-trending-up":"ti-trending-down";
    return "<div class='ks' style='color:"+cor+";font-weight:700;margin-top:5px'><i class='ti "+seta+"'></i> "+pct+"% vs mês anterior</div>";

    return "<tr style='border-left:3px solid "+(isFixa?"var(--rd)":"var(--am)")+"'>"
      +"<td style='font-weight:600'>"+d.descricao+(isMaior?" <span class='badge br2' style='font-size:9px;margin-left:4px'><i class='ti ti-trending-up'></i> Maior</span>":"")+(d.obs?"<br><span style='font-size:11px;color:var(--mt);font-weight:400'>"+d.obs+"</span>":"")+"</td>"

      +"<td><span style='display:flex;align-items:center;gap:4px;white-space:nowrap'><i class='ti "+(formaIcon[d.forma]||"ti-cash")+"' style='font-size:13px;color:var(--mt)'></i>"+d.forma+"</span></td>"
      +"<td><span class='badge "+(isFixa?"br2":"bam")+"'>"+(isFixa?"<i class='ti ti-repeat'></i> ":"<i class='ti ti-adjustments'></i> ")+d.tipo+"</span></td>"
      +"<td style='display:flex;gap:4px'>"
      +"<button class='btn bsm' style='background:var(--bl);color:var(--brand2);border-color:var(--bl)' onclick='editarDespesa("+realIdx+")' title='Editar'><i class='ti ti-edit'></i></button>"
      +"<button class='btn bd bsm' onclick='excluirDespesa("+realIdx+")' title='Excluir'><i class='ti ti-trash'></i></button>"
      +"</td></tr>";
  }).join("");
  return "<div class='card'><p class='ct'><i class='ti ti-plus'></i> Registrar despesa</p>"
    +"<div id='da'></div>"
    +"<div class='fr'><div class='fi' style='grid-column:1/-1'><label>Descrição</label><input type='text' id='dd' placeholder='Ex: Aluguel...'></div></div>"
    +"<div class='fr3'><div class='fi'><label>Valor (R$)</label><input type='number' id='dv' placeholder='0,00' step='0.01'></div>"

    +"<div class='fi'><label>Forma</label><select id='df'><option>PIX</option><option>Boleto</option><option>Cartão</option><option>PIX + Boleto</option></select></div></div>"
    +"<div class='fr'><div class='fi'><label>Tipo</label><select id='dt'><option>Fixa</option><option>Variável</option></select></div>"
    +"<div class='fi'><label>Observação</label><input type='text' id='do' placeholder='Opcional'></div></div>"
    +"<button class='btn bp bf' onclick='saveDesp()'><i class='ti ti-check'></i> Registrar despesa</button></div>"
    +"<div style='margin-bottom:12px'><div class='fi' style='max-width:150px'><label>Mês</label>"

    +(user.role==="Gestora"
      ? "<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px'>"
        +"<div class='kpi'><div class='ka' style='background:var(--rd)'></div>"
        +"<div style='width:34px;height:34px;border-radius:10px;background:#FDEDEC;display:flex;align-items:center;justify-content:center;margin-bottom:10px'><i class='ti ti-repeat' style='font-size:17px;color:var(--rd)'></i></div>"

        +"<p class='kl'>Variáveis</p><p class='kv' style='color:var(--am)'>"+BRL(vr)+"</p>"+_tendDesp(vr,vrAnt)+"</div>"
        +"<div class='kpi' style='background:linear-gradient(135deg,var(--brand2),var(--brand));border:none'><div class='ka' style='background:rgba(255,255,255,.4)'></div>"
        +"<div style='width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin-bottom:10px'><i class='ti ti-wallet' style='font-size:17px;color:#fff'></i></div>"
        +"<p class='kl' style='color:rgba(255,255,255,.85)'>Total do Mês</p><p class='kv' style='color:#fff'>"+BRL(totalMes)+"</p>"
        +(totalAnt?"<div class='ks' style='color:rgba(255,255,255,.9);font-weight:700;margin-top:5px'><i class='ti "+(totalMes>totalAnt?"ti-trending-up":totalMes<totalAnt?"ti-trending-down":"ti-minus")+"'></i> "+(totalAnt?Math.round(Math.abs(totalMes-totalAnt)/totalAnt*100):0)+"% vs mês anterior</div>":"")+"</div>"
        +"<div class='kpi'><div class='ka' style='background:#7B5EA7'></div>"
        +"<div style='width:34px;height:34px;border-radius:10px;background:#F1EBFB;display:flex;align-items:center;justify-content:center;margin-bottom:10px'><i class='ti ti-receipt' style='font-size:17px;color:#7B5EA7'></i></div>"

          +"<div style='display:flex;justify-content:space-between;font-size:11px;color:var(--mt);margin-bottom:6px'><span>Fixas "+pctFx+"%</span><span>Variáveis "+pctVr+"%</span></div>"

function calcAm(){
  var tipo=document.getElementById("ata").value,qb=document.getElementById("bqam");
  if(tipo==="fixo"){if(qb)qb.style.display="none";document.getElementById("atot").value="5.000,00";return;}
  if(qb)qb.style.display="";
  var qtd=parseInt(document.getElementById("aqam").value)||0;
  document.getElementById("atot").value=(qtd*45).toLocaleString("pt-BR",{minimumFractionDigits:2});
}
function calcNat(){
  var vl=parseFloat(document.getElementById("atn").value)||45,qtd=parseInt(document.getElementById("aqn").value)||0;
  document.getElementById("atot").value=(vl*qtd).toLocaleString("pt-BR",{minimumFractionDigits:2});

async function saveAula(){
  if(!_umaVez("saveAula"))return; // ignora duplo clique
  var prof=document.getElementById("apr").value,data=document.getElementById("adt").value;
  if(!data){alert2("aa","Preencha a data.",false);return;}
  var desc,qtd,total;
  if(prof==="Amanda"){
    var tipo=document.getElementById("ata").value;
    if(tipo==="fixo"){desc="Sal\u00e1rio fixo";qtd=0;total=5000;}
    else{qtd=parseInt(document.getElementById("aqam").value)||0;desc="Aulas extras";total=qtd*45;}
  }else{
    var vl=parseFloat(document.getElementById("atn").value)||45;
    qtd=parseInt(document.getElementById("aqn").value)||0;

function exportDocx(){
  if(!mesAtualRel){var _d=new Date();mesAtualRel=String(_d.getMonth()+1).padStart(2,"0")+"/"+_d.getFullYear();}
  var _ma=mesAtualRel.split("/"),_rm=String(+_ma[0]).padStart(2,"0"),_ra=_ma[1];
  var pfxRel=_ra+"-"+_rm+"-";
  
  var pagRel=D.pag.filter(function(p){return p.data&&p.data.startsWith(pfxRel);});
  var t={b:pagRel.reduce(function(a,p){return a+(+p.bruto||0);},0),l:pagRel.reduce(function(a,p){return a+(+p.liquido||0);},0)};
  var royalties=(t.b*0.075).toFixed(2);
  
  var atvList=ativosNoMes(_ra+"-"+_rm);
  var plMensal=atvList.filter(function(a){return(a.plano||"").toLowerCase()==="mensal";}).length;
  var plTrimestral=atvList.filter(function(a){return(a.plano||"").toLowerCase()==="trimestral";}).length;
  var plSemestral=atvList.filter(function(a){return(a.plano||"").toLowerCase()==="semestral";}).length;
  var plAnual=atvList.filter(function(a){return(a.plano||"").toLowerCase()==="anual";}).length;
  var totalAtivos=atvList.length;
  
  var mesesNomes=["","janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  var partes=mesAtualRel.split("/");
  var mesFormatado=mesesNomes[+partes[0]]+"/"+partes[1];
  var mesExtenso=mesesNomes[+partes[0]].charAt(0).toUpperCase()+mesesNomes[+partes[0]].slice(1)+" de "+partes[1];
  
  // Decodificar template base64
  var binaryString=atob(DOCX_TEMPLATE_B64);
  var bytes=new Uint8Array(binaryString.length);
  for(var i=0;i<binaryString.length;i++){bytes[i]=binaryString.charCodeAt(i);}
  
  // Carregar com JSZip
  JSZip.loadAsync(bytes).then(function(zip){
    // Ler document.xml
    return zip.file("word/document.xml").async("text").then(function(docXml){
      // Substituir placeholders (busca por padrões comuns)
      var replacements={
        "ABRIL 2026":("ABRIL "+partes[1]).toUpperCase(),
        "abril de 2026":mesExtenso,
        "abril/2026":mesFormatado.toUpperCase(),
        "abril":partes[0]==="04"?mesesNomes[+partes[0]]:mesesNomes[+partes[0]],
        "2026":partes[1],
        "R$6.067,09":BRL(t.b),
        "6.067,09":t.b.toFixed(2),

function gerarCalendarioMes(mes,ano){
  var mesesNomes=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  var diasNomes=["Dom","Seg","Ter","Qua","Qui","Sex","Sab"];
  
  var primeroDia=new Date(ano,mes,1);
  var ultimoDia=new Date(ano,mes+1,0);
  var diasDoMes=ultimoDia.getDate();
  var diaInicio=primeroDia.getDay();
  
  var html="<div>";
  html+="<div style='text-align:center;font-weight:600;margin-bottom:8px;font-size:12px'>"+mesesNomes[mes]+" "+ano+"</div>";
  html+="<div style='display:grid;grid-template-columns:repeat(7,1fr);gap:2px'>";
  
  // Headers dos dias
  for(var d=0;d<7;d++){
    html+="<div style='text-align:center;font-weight:600;font-size:10px;padding:4px;color:var(--mt)'>"+diasNomes[d].slice(0,1)+"</div>";
  }
  
  // Células vazias
  for(var v=0;v<diaInicio;v++){
    html+="<div style='height:28px'></div>";
  }
  
  // Dias do mês
  var hoje=fdISO(new Date());
  for(var dia=1;dia<=diasDoMes;dia++){
    var dataStr=ano+"-"+String(mes+1).padStart(2,"0")+"-"+String(dia).padStart(2,"0");
    var isHoje=dataStr===hoje;
    var aulasDodia=(D.agenda||[]).filter(function(a){return a.data===dataStr;}).length;
    
    html+="<div onclick='abrirDiaAgenda(\""+dataStr+"\")' style='padding:3px;border:1px solid var(--br);border-radius:4px;text-align:center;cursor:pointer;background:"+(isHoje?"var(--brand2);color:#fff":"var(--b2)")+";transition:all .2s;height:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:500'>";
    html+="<div>"+dia+"</div>";
    if(aulasDodia>0){
      html+="<div style='font-size:8px;opacity:.7'>"+aulasDodia+"</div>";
    }
    html+="</div>";
  }
  
  html+="</div></div>";
  return html;
}

function getKeyHorarioFechado(data,prof){return data+"_"+prof;}
function toggleHorarioFechado(data,prof,hora){
  var key=getKeyHorarioFechado(data,prof);
  if(!horariosFechados[key])horariosFechados[key]=new Set();
  if(horariosFechados[key].has(hora))horariosFechados[key].delete(hora);
  else horariosFechados[key].add(hora);
  localStorage.setItem("horariosFechados",JSON.stringify(Object.keys(horariosFechados).map(function(k){return {k:k,v:Array.from(horariosFechados[k]||[])};})));
}

  try{

  }catch(e){}
}

// === HELPERS: LABEL DE REAGENDAMENTO (usado em todas as visualizações da agenda) ===
function formatDataBR(ds){
  if(!ds)return "";
  var p=String(ds).split("-");
  if(p.length!==3)return ds;
  return p[2]+"/"+p[1]+"/"+p[0];
}
function parseReagendamentoNotas(notas){
  if(!notas)return null;
  var str=String(notas);
  // Novo formato: "REAGENDADA_PARA|2026-07-25|14:00"
  var parts=str.split("|");
  if(parts[0]==="REAGENDADA_PARA"&&parts.length>=3){return {tipo:"para",data:parts[1],hora:parts[2]};}
  if(parts[0]==="REAGENDADA_DE"&&parts.length>=3){return {tipo:"de",data:parts[1],hora:parts[2]};}
  // Formato antigo: "Aula reagendada de 2026-07-10" ou "Aula reagendada de 2026-07-10 (sem hora)"
  if(str.indexOf("Aula reagendada de")===0){
    var match=str.match(/Aula reagendada de (\d{4}-\d{2}-\d{2})/);
    if(match&&match[1]){
      return {tipo:"de",data:match[1],hora:"(hora não registrada)"};
    }
  }
  return null;
}
// Retorna um <p>/<div> com "↻ Reagendada para..." ou "↻ Reagendada do dia...", ou "" se não aplicável.
function reagendamentoLabelHtml(a,compact){
  var info=parseReagendamentoNotas(a.notas);
  if(!info)return "";
  var txt=info.tipo==="para"?("↻ Reagendada para "+formatDataBR(info.data)+" às "+info.hora):("↻ Reagendada do dia "+formatDataBR(info.data)+" às "+info.hora);
  if(compact)return "<div style='font-size:9px;color:#8d6e00;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>"+txt+"</div>";
  return "<p style='font-size:11px;color:#8d6e00;font-weight:600;font-style:italic;margin:4px 0 0'>"+txt+"</p>";
}

function setMesPres(m){mesAtualPres=m;refreshContent();}
// Cor por faixa de presença: >=85% verde, 70-84% amarelo, <70% vermelho.
function corPresencaTier(pct){return pct>=85?"#4CAF50":pct>=70?"#FFA726":"#D32F2F";}
// Anel/gauge circular de % de presença, em SVG puro.
function gaugePresencaSVG(pct,size){
  size=size||100;
  var cor=corPresencaTier(pct);
  var r=size/2-11,cx=size/2,cy=size/2,circ=2*Math.PI*r;
  var dash=Math.max(0,Math.min(100,pct))/100*circ;
  return "<svg width='"+size+"' height='"+size+"' viewBox='0 0 "+size+" "+size+"'>"
    +"<circle cx='"+cx+"' cy='"+cy+"' r='"+r+"' fill='none' stroke='#e7ebf1' stroke-width='11'/>"
    +"<circle cx='"+cx+"' cy='"+cy+"' r='"+r+"' fill='none' stroke='"+cor+"' stroke-width='11' stroke-linecap='round' stroke-dasharray='"+dash.toFixed(2)+" "+(circ-dash).toFixed(2)+"' transform='rotate(-90 "+cx+" "+cy+")'/>"
    +"<text x='"+cx+"' y='"+(cy+size*0.07)+"' text-anchor='middle' font-size='"+(size*0.22)+"' font-weight='800' fill='#0b1e35'>"+pct+"%</text>"
    +"</svg>";
}
// Compara o % de presença com o mês anterior e retorna um HTML de tendência (↑/↓).
function tendenciaPresencaHtml(mesAtualPfx,percentualAtual){
  var partes=mesAtualPfx.split("-"),ano=+partes[0],mes=+partes[1];
  mes--;if(mes<1){mes=12;ano--;}
  var pfxAnterior=ano+"-"+String(mes).padStart(2,"0");
  var aulasAnt=(D.agenda||[]).filter(function(a){
    return a.data.startsWith(pfxAnterior) && a.tipo!=="alerta_contrato" && a.status!=="cancelado" && a.tipo==="regular";
  });
  if(aulasAnt.length===0)return "<div style='font-size:11px;color:var(--mt);margin-top:4px'>Sem dados do mês anterior para comparar</div>";
  var presAnt=aulasAnt.filter(function(a){return a.presenca==="presenca";}).length;
  var pctAnt=Math.round(presAnt/aulasAnt.length*100);
  var delta=percentualAtual-pctAnt;
  var seta=delta>0?"▲":delta<0?"▼":"▬";
  var cor=delta>0?"#4CAF50":delta<0?"#D32F2F":"var(--mt)";
  return "<div style='font-size:13px;font-weight:700;color:"+cor+";margin-top:4px'>"+seta+" "+(delta>0?"+":"")+delta+" pontos vs mês anterior ("+pctAnt+"%)</div>";
}
function presencaHtml(){
  if(!mesAtualPres){var _d=new Date();mesAtualPres=String(_d.getMonth()+1).padStart(2,"0")+"/"+_d.getFullYear();}
  var _ma=mesAtualPres.split("/"),_pm=String(+_ma[0]).padStart(2,"0"),_pa=_ma[1];

    var mm=m.split("-"),lbl=["","Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"][+mm[1]]+"/"+mm[0];
    var val=String(+mm[1]).padStart(2,"0")+"/"+mm[0];
    return "<option value='" +val+"'" +(mesAtualPres===val?" selected":"")+">"+lbl+"</option>";

  var ativos=(D.mat||[]).filter(function(m){return!eCanc(m.nome);});

  ativos.forEach(function(a){alunosUnicos[a.nome]=a;});
  ativos=Object.keys(alunosUnicos).map(function(k){return alunosUnicos[k];});
  
  // Resumo geral do mês - APENAS ALUNOS MATRICULADOS
  var todasAulasDoMes=(D.agenda||[]).filter(function(a){
    return a.data.startsWith(mesAtualPfx) && a.tipo!=="alerta_contrato" && a.status!=="cancelado" && a.tipo==="regular";

  var totalAulasMes=todasAulasDoMes.length;
  var presencasMes=todasAulasDoMes.filter(function(a){return a.presenca==="presenca";}).length;

  var percentualMes=totalAulasMes>0?Math.round((presencasMes/totalAulasMes)*100):0;

  });
  var listaAlunosComFaltas=Object.keys(alunosComFaltas).sort(function(a,b){return alunosComFaltas[b]-alunosComFaltas[a]||a.localeCompare(b);});

  html+="<select onchange='setMesPres(this.value)' style='font-size:13px;padding:7px 10px;border:1px solid var(--br);border-radius:8px;background:var(--b2);color:var(--tx)'>"+optsPres+"</select></div>";
  html+="<button class='btn' style='background:#0b1e35;color:#fff;border:none;display:flex;align-items:center;gap:6px;font-size:13px' onclick='exportPDFPresenca()'><i class='ti ti-file-text'></i> Relatório do Mês (PDF)</button>";
  html+="</div></div>";
  
  // Grid 2 colunas
  html+="<div style='display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px'>";
  
  // COLUNA 1: RESUMO GERAL
  html+="<div>";
