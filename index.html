function selecionarAlunoPresenca(nome){
  var sel=document.getElementById("pres-aluno");
  if(!sel)return;
  sel.value=nome;
  atualizarDashboardPresenca();
  var dash=document.getElementById("pres-dashboard");
  if(dash)dash.scrollIntoView({behavior:"smooth",block:"start"});
}
function atualizarDashboardPresenca(){
  var alunoSelecionado=document.getElementById("pres-aluno").value;
  if(!mesAtualPres){var _d=new Date();mesAtualPres=String(_d.getMonth()+1).padStart(2,"0")+"/"+_d.getFullYear();}
  var _mpa=mesAtualPres.split("/"),mesAtualPfx=_mpa[1]+"-"+String(+_mpa[0]).padStart(2,"0");
  
  var html="";
  
  if(alunoSelecionado){
    // Procura aulas do aluno (com ou sem "REAGENDADO" no final)
    var aulasDoAluno=(D.agenda||[]).filter(function(a){
      var nomeBase=a.aluno.replace(" REAGENDADO","");
      return nomeBase===alunoSelecionado && a.data.startsWith(mesAtualPfx) && a.tipo!=="alerta_contrato";
    });
    // Aulas reagendadas (slot original vago) contam como FALTA nas estatísticas — mesma regra de antes.
    var aulasStats=aulasDoAluno;

    var totalAulas=aulasStats.length;
    var presenças=aulasStats.filter(function(a){return a.presenca==="presenca";}).length;
    var faltas=aulasStats.filter(function(a){return a.presenca==="falta"||a.presenca==="reagendado";}).length;
    var reagendados=aulasDoAluno.filter(function(a){return a.aluno.includes("REAGENDADO");}).length;
    var percentualPresença=totalAulas>0?Math.round((presenças/totalAulas)*100):0;

    // Faltas consecutivas (considera todo o histórico do aluno, não só o mês selecionado,
    // pois uma sequência de faltas pode atravessar a virada do mês).
    var historicoCompleto=(D.agenda||[]).filter(function(a){
      var nomeBase=a.aluno.replace(" REAGENDADO","");
      return nomeBase===alunoSelecionado && a.tipo==="regular" && a.status!=="cancelado" && (a.presenca==="presenca"||a.presenca==="falta"||a.presenca==="reagendado");
    }).sort(function(a,b){return a.data.localeCompare(b.data)||(a.hora||"").localeCompare(b.hora||"");});
    var faltasConsecutivas=0;
    for(var _fi=historicoCompleto.length-1;_fi>=0;_fi--){
      if(historicoCompleto[_fi].presenca==="falta"||historicoCompleto[_fi].presenca==="reagendado")faltasConsecutivas++;
      else break;
    }
    
    // KPIs
    html+="<div class='kg' style='grid-template-columns:repeat(2,1fr);margin-bottom:20px'>";
    html+="<div class='kpi'><div class='kl'><i class='ti ti-calendar-event'></i> Total de Aulas</div><div class='kv'>"+totalAulas+"</div></div>";
    html+="<div class='kpi'><div class='kl'><i class='ti ti-circle-check'></i> Presenças</div><div class='kv' style='color:#2E8FB3'>"+presenças+"</div></div>";
    html+="<div class='kpi'><div class='kl'><i class='ti ti-circle-x'></i> Faltas</div><div class='kv' style='color:#D32F2F'>"+faltas+"</div></div>";
    html+="<div class='kpi'><div class='kl'><i class='ti ti-arrow-back-up'></i> Reagendamentos</div><div class='kv' style='color:#FFA726'>"+reagendados+"</div></div>";
    html+="</div>";

    // Alerta de faltas consecutivas — sinal de risco mais forte que a % geral do mês.
    if(faltasConsecutivas>=2){
      html+="<div class='card' style='border-left:4px solid #B71C1C;background:#FFEBEE;padding:12px;margin-bottom:16px'>";
      html+="<p style='color:#B71C1C;font-weight:700;margin:0'><i class='ti ti-flame'></i> "+faltasConsecutivas+" faltas consecutivas</p>";
      html+="<p style='color:#B71C1C;font-size:13px;margin:8px 0 0'>Este aluno faltou nas últimas "+faltasConsecutivas+" aulas seguidas (contando o histórico completo). Vale entrar em contato antes que vire uma evasão.</p>";
      html+="</div>";
    }
    
    // Alerta se presença <= 75%
    if(percentualPresença<=75 && totalAulas>0){
      html+="<div class='card' style='border-left:4px solid #D32F2F;background:#FFEBEE;padding:12px;margin-bottom:16px'>";
      html+="<p style='color:#D32F2F;font-weight:600;margin:0'><i class='ti ti-alert'></i> Presença baixa!</p>";
      html+="<p style='color:#D32F2F;font-size:13px;margin:8px 0 0'>Apenas "+percentualPresença+"% de presença. Aluno precisa de atenção.</p>";
      html+="</div>";
    }
    
    // Gráfico de percentual
    html+="<div class='card'>";
    html+="<div style='display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap'>";
    html+="<div>"+gaugePresencaSVG(percentualPresença,96)+"</div>";
    html+="<div style='text-align:left'>";
    html+="<div style='font-size:12px;color:var(--mt);font-weight:600'>Presença este mês</div>";
    html+="<div style='font-size:11px;color:var(--mt);margin-top:2px'>"+presenças+" presentes de "+totalAulas+" aulas</div>";
    html+=tendenciaPresencaHtml(mesAtualPfx,percentualPresença);
    html+="</div>";
    html+="</div></div>";
    
    // Lista de aulas
    html+="<div class='card'>";
    html+="<div class='ct'><i class='ti ti-list'></i> Aulas deste mês</div>";
    html+="<div style='overflow-x:auto'><table>";
    html+="<thead><tr><th>Data</th><th>Hora</th><th>Professora</th><th>Status</th></tr></thead><tbody>";
    
    aulasDoAluno.sort(function(a,b){return a.data.localeCompare(b.data);}).forEach(function(a){
      var statusBg="#f0f0f0",statusTxt="—",statusLabel="Pendente";
      if(a.presenca==="presenca"){statusBg="#E8F5E9";statusTxt="#4CAF50";statusLabel="✓ Presença";}
      else if(a.presenca==="falta"){statusBg="#FFEBEE";statusTxt="#D32F2F";statusLabel="✗ Falta";}
      else if(a.presenca==="reagendado"){statusBg="#F0F0F0";statusTxt="#757575";statusLabel="↻ Reagendada";}
      
      var nomeExibicao=a.aluno.includes("REAGENDADO")?" [REAGENDADO]":"";
      
      html+="<tr>";
      html+="<td>"+a.data.split("-").reverse().join("/")+""+nomeExibicao+"</td>";
      html+="<td>"+a.hora+"</td>";
      html+="<td>"+a.professora+"</td>";
      html+="<td style='background:"+statusBg+";color:"+statusTxt+";font-weight:600;text-align:center'>"+statusLabel+"</td>";
      html+="</tr>";
    });
    
    html+="</tbody></table></div></div>";
  } else {
    html+="<div class='card'>";
    html+="<p style='color:var(--mt);text-align:center;padding:40px'>👆 Selecione um aluno para ver o dashboard</p>";
    html+="</div>";
  }
  
  document.getElementById("pres-dashboard").innerHTML=html;
}

// Data da 1ª matrícula (busca no histórico o evento "matricula" mais antigo; se não houver, cai no cadastro atual).
function dataPrimeiraMatricula(nome){
  var hs=(D.historico||[]).filter(function(h){return h.nome===nome&&h.evento==="matricula";}).map(function(h){return h.dataMatricula;}).filter(Boolean).sort();
  if(hs.length>0)return hs[0];
  var m=todosObj().find(function(a){return a.nome===nome;});

}
// Idade em anos completos a partir da data de nascimento.
function calcIdade(dataNasc){
  var hoje=new Date();
  var nasc=new Date(dataNasc+"T00:00:00");
  if(isNaN(nasc.getTime()))return null;
  var idade=hoje.getFullYear()-nasc.getFullYear();
  var m=hoje.getMonth()-nasc.getMonth();
  if(m<0||(m===0&&hoje.getDate()<nasc.getDate()))idade--;
  return idade;
}
// Idade em anos e meses (sem dias) — usada no campo "Idade" do perfil do aluno.
function calcIdadeAnosMeses(dataNasc){
  var hoje=new Date();
  var nasc=new Date(dataNasc+"T00:00:00");
  if(isNaN(nasc.getTime()))return null;
  var anos=hoje.getFullYear()-nasc.getFullYear();
  var meses=hoje.getMonth()-nasc.getMonth();
  if(hoje.getDate()<nasc.getDate())meses--;
  if(meses<0){anos--;meses+=12;}
  if(anos<0)return null;
  return {anos:anos,meses:meses};
}
function idadeAnosMesesLabel(dataNasc){
  var r=calcIdadeAnosMeses(dataNasc);
  if(!r)return "";
  var txt=r.anos+" ano"+(r.anos===1?"":"s");
  txt+=" e "+r.meses+(r.meses===1?" mês":" meses");
  return txt;
}

  out.value=el.value?idadeAnosMesesLabel(el.value):"";
}

function switchPTab(n){
  [1,2,3,4,5].forEach(function(i){
    var el=document.getElementById("ptab-"+i);if(el)el.style.display=n===i?"":"none";
    var btn=document.getElementById("ptab"+i);if(btn)btn.className="tab"+(n===i?" active":"");
  });
}

async function salvarPerfil(nome){
  if(!D.perfis)D.perfis=[];
  var idx=D.perfis.findIndex(function(p){return p.nome===nome;});
  var obj={
    nome:nome,
    dataNasc:document.getElementById("pfNasc").value||"",
    nomePai:document.getElementById("pfPai").value||"",
    nomeMae:document.getElementById("pfMae").value||"",
    telefone:document.getElementById("pfTel").value||"",
    email:document.getElementById("pfEmail").value||"",
    obs:document.getElementById("pfObs").value||"",
    dataExperimental:document.getElementById("pfExp")?document.getElementById("pfExp").value:(getPerfil(nome)||{}).dataExperimental||""
  };
  if(idx>=0)D.perfis[idx]=obj;else D.perfis.push(obj);
  savePerfis();
  var msg=document.getElementById("pfMsg");
  if(msg)msg.innerHTML="<div class='al2 als'><i class='ti ti-check'></i> Dados salvos!</div>";
  setTimeout(function(){if(msg)msg.innerHTML="";},2500);
}

    if(diff<0)return {classe:"badge-atrasado",texto:"⚠️ "+Math.abs(diff)+"d"};

  var finalizadosHtml=finalizados.map(function(l){

function saveNovoLead(){

  if(!obj.crianca.trim()){alert("Preencha o nome da criança");return;}

function formatDateBR(dateStr){

}

          +"</div>"

          +"<div><span style='color:var(--mt)'>Vencimento:</span><br><strong>"+(h.vencimento?fd(h.vencimento):"Mensal")+"</strong></div>"
          +"<div><span style='color:var(--mt)'>Valor:</span><br><strong>"+BRL(h.valor)+"</strong></div>"
          +"</div></div>";
      }).join("")+"</div>";
    }
    html+="</div></div></div>";
    document.getElementById("mc").innerHTML=html;
    return;
  }
  var recs=(D.pront||[]).filter(function(r){return r.aluno===nome&&r.tipo===prontLeituraSub;}).sort(function(a,b){return String(b.data).localeCompare(String(a.data));});
  html+="<div class='card'><p class='ct'><i class='ti ti-list'></i> Registros ("+recs.length+")</p>";
  if(recs.length===0)html+="<p class='empty'>Nenhum registro ainda.</p>";

    html+="<div class='card c0' style='margin-bottom:8px;border-left:4px solid var(--brand)'>"+prontResumo(r)+"</div>";
  });
  html+="</div></div></div>";
  document.getElementById("mc").innerHTML=html;
}

function prDados(r){try{if(!r.dados)return{};return typeof r.dados==="string"?JSON.parse(r.dados):r.dados;}catch(e){return{};}}
async function _saveProntNow(){
  var h=["id","aluno","tipo","data","dados","criadoEm"];
  var rows=(D.pront||[]).map(function(p){
    var dd=typeof p.dados==="string"?p.dados:JSON.stringify(p.dados||{});
    return [String(p.id||""),String(p.aluno||""),String(p.tipo||""),String(p.data||""),dd,String(p.criadoEm||"")];
  });
  return await rewriteAba("prontuario",h,rows);
}

async function salvarPront(){
  if(!prontAluno){alert("Selecione um aluno.");return;}
  if(!_umaVez("salvarPront"))return;
  var data=_prV("pr-data");
  if(!data){alert2("pr-alert","Informe a data.",false);return;}
  var dados={};
  if(prontSub==="evolucoes"){dados={objetivos:_prV("pr-obj"),exercicios:_prV("pr-exe"),evolucao:_prV("pr-evo"),obs:_prV("pr-obs")};}
  else if(prontSub==="plano"){dados={curto:_prV("pr-curto"),medio:_prV("pr-medio"),longo:_prV("pr-longo")};}
  else if(prontSub==="feedback"){dados={feedback:_prV("pr-fb")};}
  else if(prontSub==="avaliacoes"){
    dados={tipoav:_prV("pr-tipoav"),avobs:_prV("pr-avobs"),ficha:prontFicha};
    if(prontFicha==="motora"){
      AV_SECS.forEach(function(sec){sec.items.forEach(function(it){it.s.forEach(function(sb){
        var v=_prV("pf_"+it.k+"_"+sb[0]);if(v)dados[it.k+"_"+sb[0]]=v;
      });});});
    }else{
      FIS_SECS.forEach(function(sec){sec.rows.forEach(function(r){
        var v=_prV("pf_"+r.k);if(v)dados[r.k]=v;
      });});
    }
  }
  if(prontEdit){
    var reg=(D.pront||[]).find(function(x){return x.id===prontEdit.id;});
    if(reg){reg.data=data;reg.dados=JSON.stringify(dados);}
  }else{
    D.pront.push({id:_novoId("pr"),aluno:prontAluno,tipo:prontSub,data:data,dados:JSON.stringify(dados),criadoEm:fdISO(new Date())});
  }
  var ok=await _saveProntNow();
  if(ok){prontEdit=null;prontFicha="motora";refreshContent();}
  else{alert("Erro ao salvar no Google Sheets. Verifique se a aba \"prontuario\" existe na planilha.");}
}

async function excluirPront(id){
  if(!confirm("Excluir este registro do prontuário? Isso é permanente."))return;
  var i=(D.pront||[]).findIndex(function(x){return x.id===id;});
  if(i<0)return;
  var removido=D.pront.splice(i,1)[0];
  var ok=await _saveProntNow();
  if(ok){if(prontEdit&&prontEdit.id===id)prontEdit=null;refreshContent();}
  else{D.pront.splice(i,0,removido);alert("Erro ao excluir no Google Sheets. O registro NÃO foi apagado — tente novamente.");refreshContent();}
}

function primeiraMatriculaData(aluno){
  var hist=(D.historico||[]).filter(function(h){return h.nome===aluno;});
  // 1) preferir o evento explícito "matricula" (criado uma única vez, nunca sobrescrito)
  var mEvt=hist.filter(function(h){return h.evento==="matricula";});
  if(mEvt.length){
    mEvt.sort(function(a,b){return String(a.dataEvento||a.dataMatricula).localeCompare(String(b.dataEvento||b.dataMatricula));});
    return mEvt[0].dataMatricula||mEvt[0].dataEvento||"";
  }
  // 2) fallback: menor data de qualquer evento do histórico (matricula ou renovacao)
  if(hist.length){
    hist.sort(function(a,b){return String(a.dataEvento||a.dataMatricula).localeCompare(String(b.dataEvento||b.dataMatricula));});
    return hist[0].dataMatricula||hist[0].dataEvento||"";
  }
  // 3) último fallback: dataMatricula atual (pode ser de rematrícula, mas é o único dado disponível)
  var a=todosObj().find(function(x){return x.nome===aluno;});
  return a?(a.dataMatricula||""):"";
}

// Monta os segmentos (motivo, quantidade, cor) a partir da lista de alunos.
function _segmentosMotivo(lista){
  var total=lista.length;
  var segs=MOTIVOS_NAO_FECHOU.map(function(m){
    return {key:m[0],label:m[1],qtd:lista.filter(function(a){return a.motivoNaoFechou===m[0];}).length,cor:MOTIVO_COR[m[0]]||"#8b95a3"};
  });
  var semMotivo=lista.filter(function(a){return !a.motivoNaoFechou;}).length;
  if(semMotivo>0)segs.push({key:"_sem",label:"Não informado",qtd:semMotivo,cor:MOTIVO_SEM_COR});
  segs.forEach(function(s){s.pct=total>0?Math.round(s.qtd/total*100):0;});
  return segs;
}
// Gráfico de rosca (donut) em SVG puro + legenda, com o total no centro. Estilo dashboard.
function pdfDashboardMotivos(lista){
  var total=lista.length;
  var segs=_segmentosMotivo(lista).filter(function(s){return s.qtd>0;});
  segs.sort(function(a,b){return b.qtd-a.qtd;});
  var r=64,cx=90,cy=90,sw=28,circ=2*Math.PI*r,acc=0;
  var arcs="";
  if(segs.length===1){
    arcs+="<circle cx='"+cx+"' cy='"+cy+"' r='"+r+"' fill='none' stroke='"+segs[0].cor+"' stroke-width='"+sw+"'/>";
  }else{
    segs.forEach(function(s){
      var frac=s.qtd/total;
      var dash=frac*circ;
      var offset=-acc*circ;
      arcs+="<circle cx='"+cx+"' cy='"+cy+"' r='"+r+"' fill='none' stroke='"+s.cor+"' stroke-width='"+sw+"' stroke-dasharray='"+dash.toFixed(2)+" "+(circ-dash).toFixed(2)+"' stroke-dashoffset='"+offset.toFixed(2)+"' transform='rotate(-90 "+cx+" "+cy+")'/>";
      acc+=frac;
    });
  }
  var top=segs[0];
  var svg="<svg width='180' height='180' viewBox='0 0 180 180'>"+arcs
    +"<text x='"+cx+"' y='"+(cy-6)+"' text-anchor='middle' font-size='32' font-weight='800' fill='#0b1e35' font-family='Plus Jakarta Sans,sans-serif'>"+total+"</text>"
    +"<text x='"+cx+"' y='"+(cy+16)+"' text-anchor='middle' font-size='11' fill='#7a8fa3' font-family='Plus Jakarta Sans,sans-serif'>aluno(s)</text>"
    +"</svg>";
  var legenda="<div style='flex:1;min-width:220px'>";
  segs.forEach(function(s){
    legenda+="<div style='display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef1f5'>"
      +"<div style='display:flex;align-items:center;gap:9px'><span style='width:12px;height:12px;border-radius:3px;background:"+s.cor+";display:inline-block;flex-shrink:0'></span>"
      +"<span style='font-size:12px;font-weight:600;color:#2b2f38'>"+s.label+"</span></div>"
      +"<div style='text-align:right'><span style='font-size:14px;font-weight:800;color:"+s.cor+"'>"+s.pct+"%</span> <span style='font-size:10px;color:#98a2b0'>("+s.qtd+")</span></div>"
      +"</div>";
  });
  legenda+="</div>";
  var kpi="<div style='display:flex;gap:12px;margin-bottom:18px'>"
    +"<div style='flex:1;background:#f7f9fb;border-radius:10px;padding:14px 16px'><div style='font-size:10px;color:#7a8fa3;font-weight:700;text-transform:uppercase;letter-spacing:.5px'>Total analisado</div><div style='font-size:22px;font-weight:800;color:#0b1e35;margin-top:2px'>"+total+" aluno(s)</div></div>"
    +(top?"<div style='flex:1;background:#f7f9fb;border-radius:10px;padding:14px 16px'><div style='font-size:10px;color:#7a8fa3;font-weight:700;text-transform:uppercase;letter-spacing:.5px'>Motivo mais frequente</div><div style='font-size:16px;font-weight:800;color:"+top.cor+";margin-top:2px'>"+top.label+" — "+top.pct+"%</div></div>":"")
    +"</div>";
  var h="<div class='pdf-section-title'>Painel — Motivos de não fechamento</div>";
  h+=kpi;
  h+="<div style='display:flex;gap:28px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #e7ebf1;border-radius:12px;padding:20px 24px;margin-bottom:6px'>";
  h+="<div style='flex-shrink:0'>"+svg+"</div>";
  h+=legenda;
  h+="</div>";
  return h;
}

var PONTO_TIPO_COR={normal:"#1B5F7A",atestado_dia:"#7B5EA7",atestado_horas:"#7B5EA7",falta_dia:"#D32F2F",falta_horas:"#D32F2F"};
// Horas s\u00e3o guardadas SEMPRE como minutos (n\u00famero) \u2014 evita o bug do Sheets
// converter "08:00" em serial de data (mesmo problema j\u00e1 corrigido na Agenda).
function _pMin(v){
  if(v===0)return 0;
  if(v===""||v===null||v===undefined)return null;
  var s=String(v).trim();
  if(/^\d+$/.test(s))return +s;
  var m=s.match(/^(\d{1,2}):(\d{2})/);
  if(!m)return null;
  return (+m[1])*60+(+m[2]);
}
function _pHora(m){m=_pMin(m);if(m===null)return "\u2014";return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}
function _pDur(min){
  var neg=min<0;min=Math.abs(Math.round(min));
  var h=Math.floor(min/60),mm=min%60;
  return (neg?"-":"")+h+"h"+(mm?" "+String(mm).padStart(2,"0")+"min":"");
}
function _pDiasUteis(ano,mes){ // mes 1-12; segunda a sexta
  var n=0,ult=new Date(ano,mes,0).getDate();
  for(var d=1;d<=ult;d++){var dw=new Date(ano,mes-1,d).getDay();if(dw>=1&&dw<=5)n++;}
  return n;
}
function _pDiaSemana(iso){
  var nomes=["Dom","Seg","Ter","Qua","Qui","Sex","S\u00e1b"];
  return nomes[new Date(iso+"T12:00").getDay()];
}
function _pTrabalhado(r){
  if(r.tipo!=="normal")return 0;
  var e=_pMin(r.entMin),s=_pMin(r.saiMin);
  if(e===null||s===null)return 0;
  var tot=s-e;
  var sa=_pMin(r.salMin),ra=_pMin(r.retMin);
  if(sa!==null&&ra!==null&&ra>sa)tot-=(ra-sa);
  return Math.max(tot,0);
}
function _pResumo(func,pfx){ // pfx "YYYY-MM"
  var regs=(D.ponto||[]).filter(function(r){return r.func===func&&String(r.data||"").startsWith(pfx);})
    .slice().sort(function(a,b){return String(a.data)<String(b.data)?-1:1;});
  var pp=pfx.split("-"),diasUteis=_pDiasUteis(+pp[0],+pp[1]);
  var contratado=diasUteis*480; // 8h/dia \u00fatil
  var trab=0,abonado=0,faltaDias=0,faltaMin=0,atDias=0,atMin=0;
  regs.forEach(function(r){
    if(r.tipo==="normal")trab+=_pTrabalhado(r);
    else if(r.tipo==="atestado_dia"){abonado+=480;atDias++;}
    else if(r.tipo==="atestado_horas"){var q=_pMin(r.qtdMin)||0;abonado+=q;atMin+=q;}
    else if(r.tipo==="falta_dia")faltaDias++;
    else if(r.tipo==="falta_horas")faltaMin+=_pMin(r.qtdMin)||0;
  });
  var saldo=trab+abonado-contratado;
  return {regs:regs,diasUteis:diasUteis,contratado:contratado,trab:trab,abonado:abonado,atDias:atDias,atMin:atMin,faltaDias:faltaDias,faltaMin:faltaMin,saldo:saldo};
}
async function _savePontoNow(){
  var rows=(D.ponto||[]).map(function(p){return PONTO_H.map(function(k){var v=p[k];return (v===undefined||v===null)?"":String(v);});});
  await rewriteAba("ponto",PONTO_H,rows);
}

function _pfxPonto(){
  if(!mesAtualPonto){var _d=new Date();mesAtualPonto=String(_d.getMonth()+1).padStart(2,"0")+"/"+_d.getFullYear();}
  var mm=mesAtualPonto.split("/");
  return mm[1]+"-"+String(+mm[0]).padStart(2,"0");
}

function togglePontoQtd(v){document.getElementById("pt-qtd-div").style.display=(v==="atestado_horas"||v==="falta_horas")?"block":"none";}
function salvarPonto(){
  if(!user||user.role!=="Gestora")return;
  if(!_umaVez("salvarPonto"))return;
  var data=document.getElementById("pt-data").value;
  if(!data){alert2("pt-alert","Informe a data.",false);return;}
  var ent=_pMin(document.getElementById("pt-ent").value),sal=_pMin(document.getElementById("pt-sal").value),
      ret=_pMin(document.getElementById("pt-ret").value),sai=_pMin(document.getElementById("pt-sai").value);
  if(ent===null&&sal===null&&ret===null&&sai===null){alert2("pt-alert","Preencha pelo menos um hor\u00e1rio.",false);return;}
  if(ent!==null&&sai!==null&&sai<=ent){alert2("pt-alert","A sa\u00edda precisa ser depois da entrada.",false);return;}
  if(sal!==null&&ret!==null&&ret<=sal){alert2("pt-alert","O retorno do almo\u00e7o precisa ser depois da sa\u00edda para almo\u00e7o.",false);return;}
  var exist=(D.ponto||[]).find(function(r){return r.func===funcPontoSel&&r.data===data&&r.tipo==="normal";});
  if(exist){
    exist.entMin=ent===null?"":ent;exist.salMin=sal===null?"":sal;exist.retMin=ret===null?"":ret;exist.saiMin=sai===null?"":sai;
  }else{
    D.ponto.push({id:_novoId("pt"),func:funcPontoSel,data:data,tipo:"normal",entMin:ent===null?"":ent,salMin:sal===null?"":sal,retMin:ret===null?"":ret,saiMin:sai===null?"":sai,qtdMin:"",obs:""});
  }
  savePonto();
  refreshContent();
}
function salvarOcorrenciaPonto(){
  if(!user||user.role!=="Gestora")return;
  if(!_umaVez("salvarOcPonto"))return;
  var tipo=document.getElementById("pt-tipo").value;
  var data=document.getElementById("pt-data2").value;
  var obs=(document.getElementById("pt-obs").value||"").trim();
  if(!data){alert2("pt-alert2","Informe a data.",false);return;}
  var qtd="";
  if(tipo==="atestado_horas"||tipo==="falta_horas"){
    qtd=_pMin(document.getElementById("pt-qtd").value);
    if(qtd===null||qtd<=0){alert2("pt-alert2","Informe a dura\u00e7\u00e3o (hh:mm).",false);return;}
  }
  var exist=(D.ponto||[]).find(function(r){return r.func===funcPontoSel&&r.data===data&&r.tipo===tipo;});
  if(exist){exist.qtdMin=qtd;exist.obs=obs;}
  else D.ponto.push({id:_novoId("pt"),func:funcPontoSel,data:data,tipo:tipo,entMin:"",salMin:"",retMin:"",saiMin:"",qtdMin:qtd,obs:obs});
  savePonto();
  refreshContent();
}
function editarPonto(id){
  var r=(D.ponto||[]).find(function(x){return x.id===id;});
  if(!r)return;
  if(r.tipo==="normal"){
    document.getElementById("pt-data").value=r.data;
    document.getElementById("pt-ent").value=_pMin(r.entMin)!==null?_pHora(r.entMin):"";
    document.getElementById("pt-sal").value=_pMin(r.salMin)!==null?_pHora(r.salMin):"";
    document.getElementById("pt-ret").value=_pMin(r.retMin)!==null?_pHora(r.retMin):"";
    document.getElementById("pt-sai").value=_pMin(r.saiMin)!==null?_pHora(r.saiMin):"";
    document.getElementById("pt-alert").innerHTML="<div class='al2 ali'><i class='ti ti-info-circle'></i> Editando "+fd(r.data)+" \u2014 ajuste e clique em Salvar ponto.</div>";
  }else{
    document.getElementById("pt-tipo").value=r.tipo;
    togglePontoQtd(r.tipo);
    document.getElementById("pt-data2").value=r.data;
    if(r.tipo==="atestado_horas"||r.tipo==="falta_horas")document.getElementById("pt-qtd").value=_pHora(r.qtdMin);
    document.getElementById("pt-obs").value=r.obs||"";
    document.getElementById("pt-alert2").innerHTML="<div class='al2 ali'><i class='ti ti-info-circle'></i> Editando "+fd(r.data)+" \u2014 ajuste e clique em Salvar ocorr\u00eancia.</div>";
  }
  window.scrollTo({top:0,behavior:"smooth"});
}
function excluirPonto(id){
  if(!user||user.role!=="Gestora")return;
  var r=(D.ponto||[]).find(function(x){return x.id===id;});
  if(!r)return;
  if(!confirm("Excluir o registro de "+fd(r.data)+" ("+(PONTO_TIPO_LBL[r.tipo]||r.tipo)+") de "+r.func+"?"))return;
  D.ponto=(D.ponto||[]).filter(function(x){return x.id!==id;});
  savePonto();
  refreshContent();
}

  // Registros
  h+="<div class='pdf-section-title'>Registros di\u00e1rios <span class='pdf-count'>"+R.regs.length+"</span></div>";
  if(R.regs.length===0){
    h+="<div class='pdf-empty'>Nenhum registro neste m\u00eas.</div>";
  }else{
    h+="<table class='pdf-tbl'><tbody>";
    h+="<tr style='background:#f7f9fb'><td style='font-weight:800;color:#0b1e35;width:16%'>Data</td><td style='font-weight:800;color:#0b1e35;width:11%'>Entrada</td><td style='font-weight:800;color:#0b1e35;width:11%'>Sa\u00edda alm.</td><td style='font-weight:800;color:#0b1e35;width:11%'>Retorno</td><td style='font-weight:800;color:#0b1e35;width:11%'>Sa\u00edda</td><td style='font-weight:800;color:#0b1e35;width:12%'>Horas</td><td style='font-weight:800;color:#0b1e35'>Ocorr\u00eancia / Obs.</td></tr>";
    R.regs.forEach(function(r){
      var horasDia,oc="";
      if(r.tipo==="normal"){horasDia=_pDur(_pTrabalhado(r));}
      else if(r.tipo==="atestado_dia"||r.tipo==="falta_dia"){horasDia="8h (dia)";oc=PONTO_TIPO_LBL[r.tipo];}
      else{horasDia=_pDur(_pMin(r.qtdMin)||0);oc=PONTO_TIPO_LBL[r.tipo];}
      if(r.obs)oc+=(oc?" \u2014 ":"")+prEsc(r.obs);
      var e4=r.tipo==="normal"?"<td>"+_pHora(r.entMin)+"</td><td>"+_pHora(r.salMin)+"</td><td>"+_pHora(r.retMin)+"</td><td>"+_pHora(r.saiMin)+"</td>":"<td colspan='4' style='color:#98a2b0'>\u2014</td>";
      h+="<tr><td style='font-weight:600'>"+fd(r.data)+" ("+_pDiaSemana(r.data)+")</td>"+e4+"<td style='font-weight:700'>"+horasDia+"</td><td>"+(oc||"\u2014")+"</td></tr>";
    });
    h+="</tbody></table>";
  }
  // Resumo
  h+="<div class='pdf-section-title'>Resumo do m\u00eas</div>";
  h+="<table class='pdf-tbl'><tbody>";
  h+="<tr><td>Horas contratadas ("+R.diasUteis+" dias \u00fateis x 8h)</td><td style='font-weight:700'>"+_pDur(R.contratado)+"</td></tr>";
  h+="<tr><td>Horas trabalhadas</td><td style='font-weight:700'>"+_pDur(R.trab)+"</td></tr>";
  h+="<tr><td>Horas abonadas por atestado</td><td style='font-weight:700'>"+_pDur(R.abonado)+(R.atDias||R.atMin?" ("+(R.atDias?R.atDias+" dia(s)":"")+(R.atDias&&R.atMin?" + ":"")+(R.atMin?_pDur(R.atMin):"")+")":"")+"</td></tr>";
  h+="<tr><td style='font-weight:700;color:"+(R.saldo>=0?"#2e7d32":"#c62828")+"'>"+(R.saldo>=0?"Horas excedentes":"Horas em falta")+"</td><td style='font-weight:800;color:"+(R.saldo>=0?"#2e7d32":"#c62828")+"'>"+_pDur(Math.abs(R.saldo))+"</td></tr>";
  if(R.faltaDias>0||R.faltaMin>0){
    var descTxt=[];
    if(R.faltaDias>0)descTxt.push(R.faltaDias+" dia(s)");
    if(R.faltaMin>0)descTxt.push(_pDur(R.faltaMin));
    h+="<tr><td style='font-weight:800;color:#c62828'>DESCONTAR (falta n\u00e3o justificada)</td><td style='font-weight:800;color:#c62828'>"+descTxt.join(" e ")+"</td></tr>";
  }
  h+="</tbody></table>";
  h+="</div>";
  h+=pdfFooterPremium();
  h+="</div></body></html>";
  var w=window.open("","_blank","width=900,height=700");if(!w){alert("Bloqueador de pop-up ativado.");return;}
  w.document.write(h);w.document.close();w.focus();
  setTimeout(function(){w.print();},1200);
}
// ===== FIM PONTO CLT =====

render();

</script>
</body>
